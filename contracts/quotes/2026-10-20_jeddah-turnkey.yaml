# عرض سعر تسليم مفتاح — كوخ جدة (دورين 8 × 10) + الأعمال الخارجية + التجهيزات والفرش.
# الملف الداخلي للمصنع: base = تكلفة المصنع للوحدة (من المورد/المقاول)، والعميل يشوف سعر الوحدة بعد الهامش فقط.
#   markup على مستوى القسم (افتراضي 15%) — يغطي الإشراف والمتابعة والتنسيق + هامش ربح. الكوخ نفسه بسعر المصنع (بدون هامش).
#   أي بند يقدر يغيّر الهامش بـ markup خاص.
# بدون اسم العميل أو رقمه هنا (يُكتب باليد على النسخة المطبوعة).
#   python tools/quote.py contracts/quotes/2026-10-20_jeddah-turnkey.yaml -o عرض.pdf
#   python tools/quote.py ... --internal   ← يطبع ملخص التكلفة والهامش (للمصنع فقط، ما يدخل الـPDF)
number: WQ-2026-1020-01
date: 2026-10-20
validity_days: 15
title: عرض سعر تنفيذ مشروع كوخ خشبي مع الأعمال الخارجية — تسليم مفتاح
project: كوخ خشبي دورين (8.00 × 10.00 م = 160 م²) مع السور والمسبح واللاندسكيب والتجهيزات والفرش
site: جدة
duration_days: 120
round_to: 50              # تقريب سعر الوحدة للعميل
vat_included: true        # الأسعار للعميل شاملة ضريبة القيمة المضافة 15%
payments:
  - [30, "الدفعة الأولى عند توقيع العقد واعتماد المخططات"]
  - [25, "الدفعة الثانية عند الانتهاء من القواعد والسور حتى منسوب الجسور وحفر المسبح"]
  - [30, "الدفعة الثالثة عند توريد الكوخ للموقع وبدء التركيب"]
  - [15, "الدفعة النهائية عند التسليم وتوقيع محضر الاستلام"]

sections:
  - name: الكوخ الخشبي (تصنيع وتركيب المصنع)
    markup: 0
    items:
      - {item: "كوخ خشبي دورين 8.00 × 10.00 م (160 م² مبني) حسب المخططات المعتمدة — هيكل وجدران وسقف وعزل وأبواب وشبابيك ودرج داخلي، شامل التراس والبلكونة الأمامية والأعمدة الخشبية بدون تكلفة إضافية", qty: 160, unit: م², base: 1096}

  - name: الأعمال الهندسية والإنشائية
    items:
      - {item: "مكتب هندسي معتمد: المخططات المعمارية والإنشائية ومتابعة إصدار رخصة البناء (الرسوم الحكومية على العميل)", qty: 1, unit: مقطوعية, base: 15000}
      - {item: "السور الخارجي: قواعد وأعمدة وجسور خرسانية مسلحة + بلك 20 سم بالارتفاع والأطوال حسب المخطط المعتمد", qty: 1, unit: مقطوعية, base: 150000}
      - {item: "لياسة السور (داخلي وخارجي) + القواعد والصبة الخرسانية لأرضية الكوخ حسب المخطط الإنشائي", qty: 1, unit: مقطوعية, base: 40000}
      - {item: "بوابة سيارة 3.80 م (حديد + شرائح خشب) مع ماتور + باب مشاة", qty: 1, unit: مقطوعية, base: 12000}
      - {item: "بيارة خرسانية (غرفتين) مع غطاء وتوصيل الصرف من الكوخ", qty: 1, unit: مقطوعية, base: 16000}
      - {item: "خزان أرضي خرساني بسعة تقريبية 20 م³ + مضخة + خزان علوي وتوصيلات", qty: 1, unit: مقطوعية, base: 23000}

  - name: المسبح
    items:
      - {item: "مسبح فايبرجلاس جاهز بشكل حر — موديل الجناح B003 — 9.32 × 4.22 م، عمق 1.20–1.80 م، شامل: فلتر 24\" + مضخة 1.5 حصان + 2 كشاف LED + محول + 4 موجهات + 2 سكيمر + صفاية أرضية + فتحة مكنسة + مكنسة 4 قطع (هدية)", qty: 1, unit: مقطوعية, base: 36750, photo: pool_kidney.jpg}
      - {item: "أعمال موقع المسبح: رافعة (كرين) لتنزيل المسبح، الحفر ونقل المخلفات، فرشة بحص 3/8 سماكة 20 سم، الردم والتثبيت، غرفة/موقع المعدات ومصدر الكهرباء", qty: 1, unit: مقطوعية, base: 16000}
      - {item: "صبة خرسانية وإطار رخام/حجر حول حافة المسبح (كوبنج)", qty: 24, unit: م.ط, base: 260}

  - name: اللاندسكيب والأعمال الخارجية
    items:
      - {item: "بلاط خارجي مانع للانزلاق (حول المسبح + الممرات + الموقف)", qty: 60, unit: م², base: 140}
      - {item: "برجولة خشب للجلسة الخارجية + جلسة مبنية", qty: 1, unit: مقطوعية, base: 11000}
      - {item: "المسطحات الخضراء: تربة زراعية + ثيل + شبكة ري + نخيل وأشجار وشجيرات + أحواض الزراعة", qty: 1, unit: مقطوعية, base: 19000}
      - {item: "تمديدات الكهرباء الخارجية: التغذية من العداد + إنارة الحديقة (أعمدة إنارة أسود ≈ 8 حبات) + إنارة السور والممرات", qty: 1, unit: مقطوعية, base: 14000, photo: light_garden_pole.jpg}
      - {item: "تمديدات السباكة الخارجية: المسبح والري والصرف للبيارة والخزان", qty: 1, unit: مقطوعية, base: 11000}

  - name: الكهرباء والسباكة الداخلية
    items:
      - {item: "كهرباء الكوخ بالكامل: تمديد وتركيب — أفياش ومفاتيح الفنار (ماسة أسود) + أسلاك الفنار + قواطع حساس + لوحتين توزيع، حسب جدول الكميات المرفق بالمخطط (A-11)", qty: 1, unit: مقطوعية, base: 16700, photo: alfanar_socket.webp}
      - {item: "الإنارة الداخلية: سبوتات LED دفن أسود 7 واط (≈ 45 حبة) + ثريا خشب معلقة للصالة + إنارة مخفية للدرج + إنارة الممرات والبلكونة", qty: 1, unit: مقطوعية, base: 7500, photo: light_spot_black.jpg}
      - {item: "سباكة داخلية + أطقم 3 دورات مياه (مغسلة قاعدة سوداء 52×45 + كرسي + خلاطات + دش + سخان)", qty: 3, unit: دورة, base: 5500, photo: sink_black.webp}

  - name: التكييف والأجهزة
    items:
      - {item: "مكيف سبليت 18,000 وحدة إنفرتر (الصالة ×2 + الماستر) — شامل النحاس والتركيب", qty: 3, unit: جهاز, base: 3600, photo: ac_split.jpg}
      - {item: "مكيف سبليت 12,000 وحدة إنفرتر (المطبخ + غرفة 1 + غرفة 2) — شامل النحاس والتركيب", qty: 3, unit: جهاز, base: 2750}
      - {item: "ثلاجة دبل دور 18–22 قدم", qty: 1, unit: جهاز, base: 3500}
      - {item: "شاشة 65 بوصة 4K + حامل جداري وتركيب", qty: 1, unit: جهاز, base: 3750}

  - name: الأثاث والستائر
    items:
      - {item: "كنبة زاوية سرير 3 مقاعد مع تخزين (FRIHETEN) — الصالة", qty: 1, unit: حبة, base: 2495, photo: sofa_friheten.jpg}
      - {item: "كنبة مقعدين (GLOSTAD) — الصالة", qty: 1, unit: حبة, base: 895, photo: sofa_glostad.jpg}
      - {item: "طاولة وسط + طاولة تلفزيون + زولية — الصالة", qty: 1, unit: طقم, base: 1500}
      - {item: "طاولة طعام + 6 كراسي (VIHALS)", qty: 1, unit: طقم, base: 1105, photo: dining_vihals.jpg}
      - {item: "غرفة الماستر: سرير 180×200 (IDANÄS) + مرتبة + كومدينتين", qty: 1, unit: طقم, base: 3300, photo: bed_idanas_180.jpg}
      - {item: "دولاب الماستر 150 سم بأبواب (PAX/GRIMO)", qty: 1, unit: حبة, base: 2750, photo: wardrobe_pax.jpg}
      - {item: "غرفة نوم 1 و2: سرير 140×200 (VIHALS) + مرتبة", qty: 2, unit: طقم, base: 1350, photo: bed_vihals_140.jpg}
      - {item: "دولاب 3 أبواب (KLEPPSTAD) — غرفة 1 و2", qty: 2, unit: حبة, base: 749, photo: wardrobe_kleppstad.jpg}
      - {item: "توصيل وتركيب الأثاث", qty: 1, unit: مقطوعية, base: 1500}
      - {item: "ستائر (بلاك أوت + شيفون) مع المجاري — شبابيك وأبواب الدورين", qty: 20, unit: م.ط, base: 250}

