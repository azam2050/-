# عميل جديد (رسائل واتساب صوتية + مكتوبة): فيلا دورين — أرض 700 م² (البناء على جزء منها).
#  الأرضي: مجلس + مقلط (5×7) مع دورة مياه ومغاسل بينهم، صالة صغيرة (المدخل) بين المجلس والصالة الداخلية،
#          صالة داخلية تحت فراغ مزدوج، مطبخ مفتوح يطل على الصالة، غرفة غسيل، مستودع.
#  الأول: 6 غرف (5×6)، كل غرفتين يشتركون بدورة مياه بابين (3 دورات مياه كلها على جدار خارجي)، بلكونات،
#         جلسة أمامية، وفتحة (فراغ) بين الصالة العلوية والأرضية — اللي فوق يشوف تحت.
#  الخصوصية: مدخل الضيوف للمجلس (ركن الواجهة الغربي) منفصل عن مدخل العائلة (الصالة الصغيرة).
#  المسقط 22.00 × 15.00 لكل دور = 330 × 2 = 660 م² (البلكونات 2 × 22.00 × 1.80 = 79.2 م²).
#  السقف: شاليه مثل صورة العميل — سقف رئيسي 22° رفرفه 1.20 م على الواجهة والخلف، وجملون أمامي كبير بالنص
#         (10 م، 31° — قمته بمستوى القمة الرئيسية) بمثلث زجاج كامل ورفرف 1.50 م على جسور خشب بارزة بكوابيل.
#         المدادات قطع ≤ طبلية 520 فوق الجسور الحاملة الطولية.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: villa-6br-majlis-660
title: فيلا دورين — مجلس ومقلط + 6 غرف — 22.00 × 15.00
client: "عميل — فيلا 6 غرف"
meta:
  location: "—"
  usage: سكن خاص
  date: 2026-10-21
  price_note: ""
  price_scope: building
  hide_pricing: true          # السعر يُحدد بعد اعتماد المخطط
style: {preset: walnut_black, wood: natural_pine, railing: B04, window_grid: none, door_style: french, frame: wood_dark}
wall_height: 280
floors:
  - {name: الدور الأرضي, level: 0, height: 280}
  - {name: الدور الأول, level: 305, height: 280}
slab_height: 45
roof:      # شاليه مثل صورة العميل: سقف رئيسي رفرفه على الواجهة + جملون أمامي كبير بالنص بزجاج كامل وجسور بارزة بكوابيل
  ridge_axis: x
  pitch_deg: 22
  overhang: 120
  purlins: 2                # جسور حاملة طولية (2 بكل جهة + القمة) — المداد قطع ≤ طبلية 520
  purlin: {w: 20, h: 30}
  cross_gables:
    - {side: S, center: 1094, width: 1000, pitch: 31, overhang: 150, glass: true, beams: 2}
insulation: true
cladding_board_length: 400
pallet_length: 320

