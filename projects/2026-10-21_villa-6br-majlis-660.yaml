notes:
  - "مدخل الضيوف على ركن الواجهة يدخل المجلس مباشرة، ومدخل العائلة للصالة الصغيرة — باب المجلس الداخلي على الركن للصالة الصغيرة."
  - "المغاسل ودورة مياه الضيوف بين المجلس والمقلط، والمقلط بابه من المطبخ للتقديم."
  - "الصالة الداخلية تحت فراغ مزدوج 5.00 × 3.00 م عليه دربزين بالدور الأول — اللي فوق يشوف تحت."
  - "كل غرفتين يشتركون بدورة مياه ببابين، والثلاث دورات مياه على جدار خارجي بشباك."
  - "مثل صورة الشاليه: بلكونة أمامية عميقة 2.40 م تلف على الجنبين + خلفية 1.80، وتحتها تراس العائلة المسقوف على أعمدة خشب 22×22، وسحابات زجاج كبيرة للصالة."
  - "واجهة الزجاج الكبيرة يُفضّل تكون على الحوش الداخلي/المسبح (مو على الشارع) للخصوصية."
  - "السقف شاليه مثل صورة العميل: جملون عريض على الواجهة بمثلث زجاج، رفرف 1.20 م على جسور خشب بارزة، والمداد قطع فوق الجسور."
