# الباحة — فيلا خشب دورين (عميل جاد: واقع افتراضي بعد الاعتماد).
# طلب العميل ≈ 60 م² للدور (120 للدورين) — بس الدور العلوي فيه 3 غرف (ماستر بحمامها) + حمام للغرفتين + درج:
#   بمساحة 60 الغرف تطلع أقل من 3.20 × 3.60 (قاعدة المصنع)، فالبصمة 7.00 × 10.00 = 70 م² للدور (140 للدورين).
#  الأرضي: صالة 4.44 × 4.48 + مطبخ مقفل 2.20 × 4.48 + دورة مياه + غرفة عاملة بدورة مياهها + الدرج.
#  الأول: غرفتين أمام + حمام للغرفتين من الممر (جدار شرقي) + ماستر خلفي بغرفة ملابس وحمام خاص (جدار خلفي فوق دورة الأرضي).
# السقف جملون 30° محوره على العمق — المداد ≈ 440 سم (أقل من طبلية 520). الباحة جبلية وممطرة: عزل كامل.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: baha-2floor-3br-7x10
title: فيلا خشب دورين — صالة ومطبخ وغرفة عاملة + 3 غرف (ماستر) — 7.00 × 10.00 م
