# عميل جديد (رسالة): 6.00 × 5.00 — صالة + حمام + مطبخ أمريكي، سقف ممتد، واجهة زجاج، سعر المتر 1,400.
# التصميم 6.00 × 5.00 = 30 م²:
#   - الواجهة الأمامية زجاج (شباكين كبار ثابتة + باب زجاج دبل بالنص) + مثلث الجملون زجاج.
#   - السقف جملون بالعمق يمتد 2.00 م قدام على عمودين = تراس مسقوف بعرض الكوخ (يحمي الزجاج من الشمس).
#   - المطبخ الأمريكي على الجدار الخلفي (L) مفتوح على الصالة، والحمام بالركن الخلفي الشرقي بابه من الصالة جهة الخلف.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
