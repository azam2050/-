# عميل الهدا — تعديل المصنع: المقاس 5.00 × 8.00 = 40 م² (بدل 5 × 5)، والدرج مستقيم بدون لفّة طالع دايركت للدور الثاني (الميزانين).
#  الأرضي: صالة بارتفاع مزدوج تطل على الواجهة الزجاج + كنب L على الجدار الغربي كامل + طاولة العائلة شرق الدرج + مطبخ أمريكي تحت الميزانين،
#          ودورة المياه الأرضية داخل البروز الخلفي تحت دورة مياه الغرفة بالضبط (خيار 2 المعتمد — الحمامين فوق بعض).
#  الميزانين (+2.45): غرفة النوم فوق الجزء الخلفي (3.82 × 4.76) + باب دورة مياه الغرفة في البروز.
#  الدرج: حلزوني Ø1.40 م ورا (ملاحظة المصنع) يطلع من فتحة بأرضية الميزانين عليها دربزين، وآخر درجة عند باب دورة مياه الغرفة.
# الميل 55°: المداد 514 سم (رفرف 45) من طبلية 520 بدون وصلات، والقمة 5.57 م (نفس الكوخ الأصلي — العرض ما تغيّر).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: aframe-alhada-5x8
title: كوخ A-frame بواجهة زجاج + ميزانين — 5 × 8 = 40 م²
client: "عميل — الهدا"
meta:
  location: الهدا
  usage: استراحة / سكن
  date: 2026-10-19
  price_note: ""
  price_scope: building
  hide_pricing: true          # السعر يُحدد بعد اعتماد المخطط
style: {preset: walnut_black, wood: natural_pine, railing: B04, window_grid: none, door_style: french, frame: wood_dark}
wall_height: 200
height_exact: true
slab_height: 45
roof: {ridge_axis: y, pitch_deg: 55, overhang: 45}
insulation: false
cladding_board_length: 400
pallet_length: 320

walls:
  - name: جنوب
    title: الواجهة الأمامية
    glass_front: true
    glass_split: true
    start: [0, 0]
    end: [488, 0]
    openings:
      - {kind: window, code: ز1, name: زجاج ثابت يسار, offset: 6, width: 185, height: 200, sill: 10, style: fixed}
      - {kind: door, code: ب1, name: ب1 باب زجاج بإطار خشب, offset: 199, width: 90, height: 210, leaves: 1}
      - {kind: window, code: ز1, name: زجاج ثابت يمين, offset: 297, width: 185, height: 200, sill: 10, style: fixed}
  - name: شرق
    title: الواجهة الشرقية
    start: [488, 0]
    end: [488, 788]
    openings:
      - {kind: window, code: ش1, name: ش1 الصالة, offset: 60, width: 100, height: 85, sill: 65, grid: [2, 2]}
      - {kind: window, code: ش2, name: ش2 المطبخ, offset: 560, width: 90, height: 50, sill: 105, grid: [2, 1]}
  - name: شمال
    title: الواجهة الخلفية
    start: [488, 788]
    end: [0, 788]
    openings:   # باب دورة المياه الأرضية (داخل البروز)
      - {kind: door, code: ب2, name: ب2 دورة المياه, offset: 188, width: 70, height: 195}
    gable_openings:   # باب دورة مياه الغرفة (منسوب الميزانين)
      - {code: ب3, name: ب3 باب دورة مياه الغرفة, offset: 188, width: 70, height: 200, sill: 245, grid: [2, 4]}
  - name: غرب
    title: الواجهة الغربية
    start: [0, 788]
    end: [0, 0]
    openings:
      - {kind: window, code: ش3, name: ش3 الجلسة, offset: 188, width: 80, height: 75, sill: 80, grid: [2, 2]}
      - {kind: window, code: ش1, name: ش1 الصالة, offset: 628, width: 100, height: 75, sill: 80, grid: [2, 2]}

rooms:
  - {name: الصالة (ارتفاع مزدوج), rect: [6, 6, 482, 394], label: [180, 140]}
  - {name: المطبخ الأمريكي + جلسة, rect: [6, 406, 482, 782], label: [300, 470]}

mezzanines:
  - name: غرفة النوم (نص دور)
    rect: [6, 400, 482, 782]
    level: 245
    railing: [S]
    holes:   # فتحة الدرج الحلزوني بأرضية الميزانين ورا قدام باب دورة مياه الغرفة + دربزين حولها (ملاحظة المصنع)
      - {rect: [215, 555, 365, 705], railing: [S, E, W, N], gaps: {N: [[215, 300]]}}
    headroom: [159, 329]
    railing_span: [100, 388]

decks:
  - name: عتبة المدخل
    rect: [174, -126, 314, -6]
    height: 45
    railing: []
    stairs: {side: S, offset: 0, width: 140}

bumps:   # البروز الخلفي: دورة مياه الغرفة فوق (منسوب الميزانين) ودورة المياه الأرضية تحتها بالضبط
  - {wall: شمال, offset: 143, width: 160, depth: 220, base: -45, floor_z: 245, eave: 445, pitch: 40, overhang: 12,
     name_up: دورة مياه الغرفة, name_down: دورة مياه, door_h: 0}

spiral_stairs:   # ملاحظة المصنع: درج حلزوني Ø1.40 م (12 قائمة × 20.4) ورا تحت فتحة الميزانين — آخره عند باب دورة مياه الغرفة
  - {name: درج حلزوني, center: [290, 630], r: 70, rise: 245, riser: 20.4, step_deg: 30, end_deg: 135, dir: ccw}

furniture:
  # ملاحظة المصنع: كنب L متصل على الجدار الغربي كامل (من ركن الخلف لين قدام) + طاولة العائلة شرق الدرج
  - {name: كنبة, rect: [6, 60, 86, 700]}
  - {name: كنبة, rect: [6, 700, 170, 782]}
  - {name: طاولة, rect: [100, 150, 170, 250]}
  - {name: طاولة, rect: [110, 520, 170, 620]}
  - {name: طاولة 4, rect: [380, 100, 470, 260]}
  - {name: "", rect: [405, 58, 445, 95]}
  - {name: "", rect: [405, 265, 445, 302]}
  # تحت الميزانين (ارتفاع صافي 2.20): المطبخ الأمريكي على الجدار الشرقي + ركن طعام غربي، والممر لباب الدورة بالنص فاضي
  - {name: كاونتر, rect: [422, 430, 482, 700]}
  - {name: ثلاجة, rect: [417, 710, 482, 775]}
  # دورة المياه الأرضية (داخل البروز)
  - {name: دش, rect: [253, 922, 333, 1002], shape: shower}
  - {name: "", rect: [197, 952, 237, 1002], shape: wc}
  - {name: "", rect: [197, 876, 243, 922], shape: basin}
  # الميزانين (floor: -1 + z = منسوب أرضية الميزانين): السرير غرب الممر، والممر من الدرج لباب الدورة مستقيم
  - {name: سرير 120×200, rect: [90, 420, 210, 620], floor: -1, z: 245}   # رأسه على حافة الميزانين (مطل على الزجاج)
  # دورة مياه الغرفة (داخل البروز — فوق الأرضية)
  - {name: دش, rect: [253, 922, 333, 1002], shape: shower, floor: -1, z: 245}
  - {name: "", rect: [197, 952, 237, 1002], shape: wc, floor: -1, z: 245}
  - {name: "", rect: [197, 876, 243, 922], shape: basin, floor: -1, z: 245}
