# منزل خاص دورين — إجمالي 80 م² بالضبط (طلب المصنع: الشكل حر، الاحتياج كامل):
#   البصمة 5.95 × 6.72 = 40.0 م² × دورين = 80.0 م².
#   الأرضي: صالة + مطبخ مفتوح + دورة مياه + غرفة رئيسية + بلكونة (تراس أمامي) + درج U بالركن الخلفي.
#   الأول (+3.05): غرفتين قدام + ممر + دورة مياه + غرفة عاملة صغيرة ورا (فوق الدرج والخدمات).
# السقف: جملون أمامي بمثلث زجاج فوق الغرف.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: house-2floor-80
title: منزل خاص دورين 5.95 × 6.72 م — إجمالي 80 م² — صالة ومطبخ وغرفة رئيسية + غرفتين وغرفة عاملة
client: "عميل — منزل 80 م²"
meta:
  location: "—"
  usage: منزل خاص
  date: 2026-11-22
  price_note: ""
  price_scope: building
  hide_pricing: true
  terrace_separate: true
style: {preset: walnut_black, wood: natural_pine, glass: clear, frame: black, railing: B04, window_grid: grid, door_style: french}
wall_height: 280
floors:
