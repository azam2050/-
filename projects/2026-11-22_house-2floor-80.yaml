# منزل خاص دورين — إجمالي 80 م² بالضبط (طلب المصنع: الشكل حر، الاحتياج كامل):
#   البصمة 5.95 × 6.72 = 40.0 م² × دورين = 80.0 م².
#   الأرضي: صالة + مطبخ مفتوح + دورة مياه + غرفة رئيسية بدورة مياه خاصة (من المطبخ والغرفة — ملاحظة العميل) + تراس + درج U.
#   الأول (+3.05): غرفتين قدام + بلكونة فوق التراس + ممر + دورتين مياه + غرفة عاملة صغيرة ورا (ملاحظة العميل).
# السقف: جملون أمامي بمثلث زجاج فوق الغرف. الواجهة الأمامية أغلبها زجاج بمحاور متطابقة بين الدورين (تعديل المصنع).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: house-2floor-80
