# عميل جديد: منزل خاص — الكوخ المثلث (A-frame) دورين، إجمالي البناء ≈ 80 م² (تعديل المصنع: الـ 80 للدورين):
#   الأرضي 7.20 × 7.60 = 54.7 م²: صالة + مطبخ + دورة مياه + غرفة رئيسية + بلكونة (تراس أمامي).
#   الأول (+2.90) داخل المثلث ≈ 25 م²: غرفتين + دورة مياه (غرفة العاملة ما تتسع ضمن 80 م²).
# القمة ≈ 7.10 م: قاعدة 15 سم + ميل 63°. الأول بين x 160..548 (الوقفة الكاملة 247..461).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب (مثلث زجاج).
