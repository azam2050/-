# عميل جديد: منزل خاص — الكوخ المثلث (A-frame) دورين، بصمة ≈ 80 م² (9.00 × 9.00) — رسالة المصنع:
#   الأرضي: صالة + مطبخ + دورة مياه + غرفة رئيسية + بلكونة (تراس أمامي).
#   الأول (+2.90): غرفتين + دورة مياه + غرفة عاملة صغيرة.
# القمة ≈ 9.00 م: قاعدة 15 سم + ميل 63°. الأول بين x 160..728 (الوقفة الكاملة 251..637).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب (مثلث زجاج).
name: aframe-house-9x9
title: منزل خاص — كوخ مثلث (A-frame) دورين 9.00 × 9.00 م — صالة ومطبخ وغرفة رئيسية + غرفتين وغرفة عاملة
client: "عميل — كوخ مثلث 80 م²"
meta:
  location: "—"
  usage: منزل خاص
  date: 2026-11-22
  price_note: ""
  price_scope: building
  hide_pricing: true
  terrace_separate: true
style: {preset: walnut_black, wood: natural_pine, glass: clear, frame: black, railing: B04, window_grid: none, door_style: french}
wall_height: 15
height_exact: true
slab_height: 45
roof: {ridge_axis: y, pitch_deg: 63, overhang: 10, ext_start: 150, purlins: 3}
