  - {name: شرق, title: الواجهة الشرقية (السقف لين الأرض), start: [888, 0], end: [888, 888]}
  - name: شمال
    title: الواجهة الخلفية
    start: [888, 888]
    end: [0, 888]
    openings:
      - {kind: door, code: ب2, name: ب2 الباب الخلفي (الممر), offset: 318, width: 90, height: 210, leaves: 1, grid: [1, 4]}
    gable_openings:
      - {code: ش1, name: ش1 الغرفة الرئيسية, offset: 558, width: 180, height: 120, sill: 90, grid: [2, 2]}
      - {code: ش2, name: ش2 دورة المياه, offset: 128, width: 60, height: 60, sill: 170}
      - {code: ش3, name: ش3 غرفة نوم 3, offset: 348, width: 200, height: 110, sill: 380, grid: [2, 2]}
  - {name: غرب, title: الواجهة الغربية (السقف لين الأرض), start: [0, 888], end: [0, 0]}
  # ---- الأرضي: الغرفة الرئيسية (خلفي يسار) + ممر + دورة مياه (خلفي يمين) + مطبخ مفتوح على الصالة
  - {name: جدار الغرفة الرئيسية — الصالة, exterior: false, height: 270, start: [0, 500], end: [430, 500]}
  - name: جدار الغرفة الرئيسية — الممر
    exterior: false
    height: 270
    start: [430, 500]
    end: [430, 888]
    openings:
      - {kind: door, code: ب3, name: ب3 الغرفة الرئيسية, offset: 260, width: 90, height: 210}
  - {name: جدار المطبخ — دورة المياه, exterior: false, height: 270, start: [650, 700], end: [888, 700]}
  - name: جدار دورة المياه — الممر
    exterior: false
    height: 270
    start: [650, 700]
    end: [650, 888]
    openings:
      - {kind: door, code: ب4, name: ب4 دورة المياه, offset: 20, width: 70, height: 210}

