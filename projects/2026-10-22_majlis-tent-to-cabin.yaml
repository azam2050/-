notes:
  - "نفس مخطط ومساحة المجلس الأصلي (15.10 × 7.00 = 105.7 م²) — الخيمة صارت كوخ خشب."
  - "سقف الخيمة المنساب: سقف واحد هرمي بأربع جهات — كل المويه تنزل للخارج من كل الجهات، بدون أي وديان أو نقاط تجميع."
  - "كسرة السقف عند خط الجدار: 35° فوق ثم رفرف منساب 20° مثل قماش الخيمة — يغطي التراس الأمامي 2.60 م على 6 أعمدة خشب."
  - "مشراق زجاج طولي 2.80 × 1.20 م على قمة السقف فوق المشب المعلّق — إضاءة طبيعية لنص المجلس."
  - "جلسة النار تحت خيمة هرمية خشب 3.60 × 3.60 م على 4 أعمدة، وبقمتها مخرج دخان مغطى."
  - "جلسة نار خارجية 6.60 × 4.50 م بمشب دائري بالنص."
  - "دورات المياه بشفاط هواء (بدون شبابيك على جهة الجلسة الخارجية) مثل المخطط الأصلي."
  - "التشطيب الداخلي: جدار شرائح خشب خلف الجلسة وعلى جدار الخدمات بإضاءة مخفية، جسور خشب ظاهرة فوقها LED يغسل السقف المائل، كورنيش إضاءة على رأس الجدران، ثريات شرائح خشب، جلسة وسجادة بنقشة السدو، لوحات خيل وجمل، ومشب معلّق أسود بالنص."
