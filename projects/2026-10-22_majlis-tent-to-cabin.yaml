# عميل: مجلس كان مصمم خيمة/بيت شعر (مخطط + رندرات) — المطلوب نفس المخطط والمساحة بالضبط لكن كوخ خشب إبداعي.
# المخطط الأصلي: 15.10 × 7.00 = 105.7 م² — مجلس 10.39 × 6.40، مطبخ 4.05 × 2.80 بباب خدمة، دورات مياه
#   (مغاسل + 2 كبينة)، مدخل رئيسي 1.55 م على الواجهة بدرج عريض، وجلسة خارجية 6.60 × 4.50 بمشب نار.
# الفكرة الإبداعية (بدل الخيمة): "سقف الخيمة المنساب"
#   - سقف واحد هرمي بأربع جهات فوق المبنى كامل — كل المويه تنزل للخارج من كل الجهات، بدون وديان ولا تجميع.
#   - كسرة عند خط الجدار (bellcast): 35° فوق ثم 20° منساب مثل قماش الخيمة لين أوتاده — يغطي التراس الأمامي
#     كامل (2.60 م) على أعمدة خشب، و0.70–0.90 م على باقي الجهات.
#   - مشراق زجاج طولي على القمة فوق المشب المعلّق — الضوء ينزل لنص المجلس، وما يحجز مويه لأنه فوق أعلى نقطة.
#   - جلسة النار: خيمة هرمية مربعة مستقلة على 4 أعمدة بنفس اللغة، وبقمتها مخرج دخان مغطى.
#   - واجهة المجلس سحابات زجاج من الأرض للسقف محمية بالرفرف المنساب من الشمس.
#   - المجلس U حول مشب معلّق بالنص، وجدران سدو + لوحات خيل وجمل بالتشطيب.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
