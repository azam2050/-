# عميل: مجلس كان مصمم خيمة/بيت شعر (مخطط + رندرات) — المطلوب نفس المخطط والمساحة بالضبط لكن كوخ خشب إبداعي.
# المخطط الأصلي: 15.10 × 7.00 = 105.7 م² — مجلس 10.39 × 6.40، مطبخ 4.05 × 2.80 بباب خدمة، دورات مياه
#   (مغاسل + 2 كبينة)، مدخل رئيسي 1.55 م على الواجهة بدرج عريض، وجلسة خارجية 6.60 × 4.50 بمشب نار.
# الفكرة الإبداعية (بدل الخيمة):
#   - جملون زجاج كبير فوق المدخل (يشبه قمة الخيمة) بجسور خشب بارزة وكوابيل — يدخل الضوء على الجلسة.
#   - واجهة المجلس زجاج من الأرض للسقف (سحابات) وبرجولة شرائح خشب قدامها تظلل مثل قماش الخيمة.
#   - المجلس U حول مشب معلّق بالنص (مثل الرندرات)، وجدران سدو + لوحات خيل وجمل بالتشطيب.
#   - تراس خشب أمامي بدرج عريض + جلسة نار خارجية 6.60 × 4.50 جنب المجلس.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: majlis-tent-to-cabin
title: مجلس كوخ خشب (بدل الخيمة) — 15.10 × 7.00 = 105.7 م²
client: "عميل — مجلس خيمة إلى كوخ"
