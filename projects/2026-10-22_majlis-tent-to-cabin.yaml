style: {preset: walnut_black, wood: natural_pine, roof: sand, railing: B04, window_grid: none, door_style: french, frame: wood_dark}   # السقف رملي فاتح مثل قماش الخيمة
wall_height: 300
slab_height: 45
roof:      # بيت الشعر الخشبي: قمم هرمية متجاورة مثل أعمدة الخيمة (وديان بينها) — كلها خشب
  type: peaks
  pitch_deg: 30           # ميل الوجه الأمامي/الخلفي تقريباً (≥ 20°)
  overhang: 50
  peaks:
    - {rect: [-6, -6, 348, 694], h: 200}                       # قمة 1 فوق طرف المجلس
    - {rect: [348, -6, 703, 694], h: 230, lantern: 120}        # قمة 2 بالنص: مشراق زجاج فوق المشب المعلّق
    - {rect: [703, -6, 1057, 694], h: 200}                     # قمة 3 فوق المدخل
    - {rect: [1057, -6, 1504, 694], h: 170}                    # قمة 4 أوطى فوق الخدمات (مطبخ + دورات مياه)
    - {rect: [1400, -420, 1880, -60], h: 150, lantern: 70, overhang: 30}   # مظلة جلسة النار على 4 أعمدة + فتحة الدخان
insulation: true
cladding_board_length: 400
pallet_length: 320

