# تبوك — فيلا خشب دورين على بصمة 7.00 × 9.00 = 63 م² للدور (طلب العميل: 63 م²).
#  الأرضي: مجلس ضيوف 6.76 × 4.48 م بباب على الطرف (الجلسة U متصلة) وبالنص بارتشن مفتوح بعمودين مكتبة (رفوف فازات + كبت) يشيلون الدور الثاني + دورة مياه ومغاسل خلف المجلس (بعيدة عن الجلسة)
#   + مدخل عائلة منفصل بالجدار الشرقي للممر والدرج (العائلة تطلع فوق بدون ما تمر بالمجلس).
#  الأول: غرفتين (3.24 × 4.48 و 3.40 × 4.48) على بلكونة أمامية + دورة مياه فوق دورة الأرضي + مخزن/غسيل.
# نفس تخطيط شاليه الهدا المعتمد (الدرج U بالخلف، الحمامات فوق بعض على الجدار الخلفي، الغرف مقفلة بجدار).
# تبوك باردة شتاءً: عزل كامل + جملون 30° (يصرّف المطر والثلج للخارج). المداد 444 سم (أقل من طبلية 520).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
