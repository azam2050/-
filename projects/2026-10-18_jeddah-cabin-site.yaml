    - "الكوخ في آخر الأرض بعيد عن الشارع (خصوصية)، والصالة والبلكونة يطلّون على المسبح والحديقة."
    - "بوابة سيارة 3.80 م + باب مشاة مستقل، سور بلك 2.50 م بغطاء خشب أعلى السور."
    - "ممر المشاة من الباب للتراس بمحاذاة السور الغربي، والموقف عند البوابة بدون ما يقطع الحديقة."
    - "المسبح 3.50 × 8.00 م بعمق 1.40 م، حوله بلاط ودرج نزول، وكراسي استلقاء على الجهة الغربية."
    - "جلسة خارجية تحت برجولة خشب بين المسبح والسور، وظل أشجار من جهة الشارع."
    - "بلكونة بطول الواجهة على الدور الأول، أعمدة خشب من الأرض للسقف، والسقف ممتد 2 م يغطيها."
