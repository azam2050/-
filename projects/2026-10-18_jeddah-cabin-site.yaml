# عميل جدة (سكن خاص / استجمام): أرض 10 × 30 م (الواجهة 10 م على شارع 16 م)
# المطلوب: تصميم كامل للأرض (لاندسكيب): سور بلك وبوابة حديثة، مسبح، جلسة خارجية، حديقة ومسطحات خضراء بأشجار،
#   والكوخ في آخر الأرض — دورين:
#   الأرضي: صالة كبيرة تطل على الحديقة والمسبح + مطبخ + دورة مياه
#   العلوي: 3 غرف نوم (ماستر بدورة مياه خاصة + غرفتين) + دورة مياه تخدم الغرفتين
# تعديل المصنع (2): توسيع الكوخ والغرف ← 8.00 × 10.00 لكل دور = 80 × 2 = 160 م² (ارتداد جانبي 1.00 وخلفي 1.50)،
#   + بلكونة بطول الواجهة على الدور الأول بدرابزين كامل، أعمدة خشب من الأرض للسقف، والسقف ممتد للأمام يغطي البلكونة (حماية من المطر والشمس).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف (بعيد عن الشارع)، الشارع جنوب.
