    - "الكوخ بسعر المصنع للمتر المربع على المساحة المبنية (دورين) — التراس والبلكونة والأعمدة مجاناً."
    - "أعمال الموقع تقديرية بأسعار السوق السعودي وتختلف حسب المقاول والمواصفات ونوع التربة — تُعتمد بعرض سعر من المقاول."
    - "التوفير ممكن: مسبح أصغر أو فايبرجلاس جاهز، سور بلك بدون لياسة خارجية، ثيل صناعي بدل الطبيعي."
    - "غير شامل: الصبة/القواعد الخرسانية تحت الكوخ، رسوم البلدية والعداد، الأثاث والمكيفات."
