# عميل جديد — جدة (سكن خاص / استجمام): أرض 10 × 30 م (الواجهة 10 م على شارع 16 م)
# المطلوب: تصميم كامل للأرض (لاندسكيب): سور بلك وبوابة حديثة، مسبح، جلسة خارجية، حديقة ومسطحات خضراء بأشجار،
#   والكوخ في آخر الأرض (مكانه حسب رسمة المصنع) — دورين:
#   الأرضي: صالة كبيرة تطل على الحديقة والمسبح + مطبخ أمريكي + دورة مياه
#   العلوي: 3 غرف نوم (ماستر بدورة مياه خاصة + غرفتين) + دورة مياه تخدم الغرفتين
# الكوخ 7.00 × 9.00 لكل دور = 63 × 2 = 126 م². ارتدادات: 1.50 جانبي و1.50 خلفي.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف (بعيد عن الشارع)، الشارع جنوب.
