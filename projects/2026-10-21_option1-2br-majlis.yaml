# عميل (3 خيارات بمساحات مختلفة — رسالة واتساب) — الخيار 1:
#  الأرضي: مجلس 5×5 + صالة 5×5 + مطبخ مفتوح على الصالة (4×4) + دورتين مياه (ضيوف + عائلة) + درج.
#  العلوي: غرفتين نوم 4×4 + دورتين مياه، والباقي سطح (حوش علوي) قدام الدور العلوي.
# الأرضي 10.92 × 9.24 — العلوي 10.92 × 6.24 فوق الجزء الخلفي، والسطح 10.92 × 3.00 على الواجهة.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
