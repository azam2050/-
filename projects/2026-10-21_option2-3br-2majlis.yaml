# عميل (3 خيارات بمساحات مختلفة — رسالة واتساب) — الخيار 2 (الأكبر):
#  الأرضي: مجلسين 5×5 (كل مجلس بمدخل خارجي مستقل) + مغاسل ودورة مياه ضيوف بينهم + صالة 5×7 (6×7)
#          + مطبخ 3×5 مفتوح على الصالة + دورة مياه + مستودع + درج.
#  العلوي: غرفة نوم 4×4 (4×5) + غرفتين 4×5 + دورتين مياه، فوق الجزء الشرقي، والسطح (حوش علوي) فوق المجلسين.
# الأرضي 15.24 × 12.24 — العلوي 10.12 × 12.24، والسطح 5.12 × 12.24 على الجهة الغربية.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
