# الباحة — فيلا خشب دورين (تعديل 2): الواجهة مثل صورة المصنع بالضبط — واجهة عريضة، جملون زجاج بالنص فوق بلكونة،
# برندة مدخل بأعمدة ودرج، باب دبل بالنص، شبابيك كبيرة مقسّمة يمين ويسار، خشب جوزي غامق وسقف قرميد غامق.
# التوزيع مثل مخطط الصورة على احتياج العميل:
#  الأرضي: مدخل بالنص على الدرج — صالة يسار، طعام 8 أشخاص يمين، مطبخ مقفل خلفي يمين، دورة ضيوف (جدار شرقي)،
#          غرفة عاملة خلفي يسار بدورة مياهها + غسيل.
#  الأول: صالة صغيرة بالنص على البلكونة — ماستر يسار بغرفة ملابس وحمام (فوق دورة العاملة)، غرفتين يمين وحمامهم
#          (فوق دورة الضيوف).
# البصمة 11.00 × 8.50 = 93.5 م² للدور (187 م² للدورين) — الواجهة العريضة تحتاج عمق 8.50 عشان الغرف ≥ 3.20 × 3.60.
# السقف جملون 30° محوره على العرض + جملون متقاطع زجاج 45° بالنص. المداد ≈ 5.30 م → جسر حامل (purlin) بكل جهة.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: baha-villa-11x8.5
title: فيلا خشب دورين — واجهة جملون زجاج وبلكونة — 3 غرف (ماستر) — 11.00 × 8.50 م
client: "عميل — الباحة"
