# تصميم رقم 5 — خيار 3 غرف (نفس العميل ونفس التصميم): كوخ دور واحد بسقف ممتد وواجهة زجاجية عريضة
# الخيار الأصلي: غرفتين 10.00 × 7.60 = 76 م² (projects/2026-10-09_cabin-2br-glass-76.yaml).
# هنا: إضافة 3.00 م من الجهة الغربية ← 13.00 × 7.60 = 98.8 م²: غرفة نوم ثالثة بالخلف + الجلسة تتوسع بالأمام.
# البرنامج: 3 غرف نوم (ماستر بدورة مياه) + صالة واسعة (جلسة + طعام) + مطبخ أمريكي + دورتين مياه.
# السقف مائل باتجاه واحد 10° (صاج معدني) يرتفع للواجهة الزجاج — اتجاه الميل ما تغيّر فالمدادات نفسها (وصلة فوق y=418).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
