# تبوك (تعديل المصنع): نفس المساحة 63 م² للدور بس الأبعاد معكوسة — الواجهة 9.00 م والعمق 7.00 م.
#  الأرضي: مجلس عريض 8.76 × 3.70 على الواجهة كاملة، بالنص بارتشن مفتوح بعمودين مكتبة (صناديق فازات + كبت)
#          يقسمه لجلستين متقابلتين ويشيل الدور الثاني. مدخل الضيوف دبل على الطرف الشرقي من التراس (الجلسة U متصلة)
#          بمظلة ممتدة وأباليك. خلف المجلس: مغاسل + دورة مياه (شرق، بعيدة عن الجلسة)،
#          والدرج U بالنص، ومدخل العائلة منفصل من الجدار الغربي لصالة عائلة صغيرة (العائلة تطلع بدون ما تمر بالمجلس).
#  الأول: غرفتين على البلكونة (3.24 × 3.70 و 3.30 × 3.70) بينهم صالة صغيرة مطلة على البلكونة + دورة مياه فوق دورة الأرضي
#         + مخزن/غسيل.
# السقف جملون 30° محوره على العمق بمثلث زجاج بالواجهة وممتد 2.40 م فوق البلكونة على أعمدة (طابع تبوك المعتمد)،
# المداد ≈ 5.5 م → جسر حامل بكل جهة. تبوك باردة: عزل كامل.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
