# عميل جديد (مخطط مرجعي + رسالة): كوخ 9 × 9 — مطبخ سيرفس + ثلاث غرف + صالة واسعة + حمامين.
#  (معه مجلس منفصل 6 × 4 بمدخل ودورة مياه — مشروع ثاني: 2026-11-03_majlis-6x4-wc.yaml)
# التصميم 9.00 × 9.00 = 81 م² (على المرجع مع تصحيح المصمم):
#  - الصالة الواسعة 5.40 × 5.20 قدام غرب بزجاج سحاب على الدكة + المدخل، والمطبخ السيرفس L بركنها الخلفي مع جزيرة.
#  - خلف الصالة: الغرفة الرئيسية 3.44 × 3.44 بحمامها الخاص (المرجع كان فيه حمامين بعرض متر — ضيقة، صارت حمام خاص 1.84 × 1.82)،
#    وممر قصير يوزّع للرئيسية وغرفة 2.
#  - الشرق: غرفة 3 قدام + الحمام المشترك على الجدار الخارجي + غرفة 2 خلف.
# السقف (فكرة المشروع): جملون محوره موازي للواجهة 30° + جملون متقاطع صغير بارز فوق المدخل على عمودين (مظلة مدخل).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
