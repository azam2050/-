# حايل — مزرعة استثمارية: 3 أكواخ متطابقة (نفس المقاس — العميل يقرر من التقسيمات).
# طلب العميل 5×5 دورين — كبّرناه شوي (طلب المصنع) لين يطلع صالة + غرفة نوم مريحة + تراس: 6.00 × 7.00 = 42 م² للدور.
#  الأرضي: صالة بواجهة زجاج كاملة على التراس + مطبخ مفتوح + دورة مياه بدش + درج U خشب.
#  الأول: غرفة نوم 5.76 × 3.70 مقفلة بجدار على بلكونة + ركن جلسة/دولاب + حمام فوق حمام الأرضي.
# الجمالية: جملون 30° (نزّلناه حسب ملاحظة المصنع) بمثلث زجاج بالواجهة، سقف ممتد فوق البلكونة على أعمدة، خشب سيدر عسلي بإطارات سوداء.
# حايل: صيف حار وشتاء بارد → عزل كامل. المداد ≈ 430 سم (أقل من طبلية 520).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب (على التراس).
name: hail-farm-chalet-6x7
