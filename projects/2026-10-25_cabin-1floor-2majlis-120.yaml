# عميل جديد (رسالة): كوخ دور واحد 120 م² — الواجهة ضيافة (مجلس رجال)، باب جانبي يسار لمجلس النساء،
#   وخلفي: مطبخ + حمامين + غرفتين نوم. (غرفة ضيف ثالثة إذا سمحت المساحة.)
# التصميم 12.00 × 10.00 = 120 م²:
#   - الأمام: مجلس الرجال (الضيافة) بمدخل ضيوف بالركن الشرقي فيه دورة مياه الضيوف — الضيف ما يدخل جهة العائلة.
#     ومجلس النساء غرباً بباب جانبي مستقل (يسار) تحت مظلة، ويفتح من داخله على ممر العائلة.
#   - الخلف: ممر عائلة → غرفتين نوم + حمام عائلة واسع، والمطبخ بالركن الخلفي الشرقي يخدم مجلس الرجال بباب خدمة،
#     وله باب خلفي.
#   - الغرفة الثالثة: ما تطلع بمقاس صحيح (≥ 3.20 × 3.60) داخل 120 م² إلا على حساب المجالس —
#     البديل المقترح: 12.00 × 11.20 (134 م²) تضيف غرفة ضيف بحمامها (يُرسم إذا وافق العميل).
#   - السقف: جملون رئيسي بالطول + جملون متقاطع فوق مجلس الرجال يمتد 2.00 م قدام على عمودين = مظلة مدخل الضيوف.
# ملاحظة العميل: تراس خارجي + واجهة فيها زجاج بس مو مرة زجاجية (شبابيك المجلس كبيرة على التراس والباقي خشب).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
