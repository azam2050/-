# عميل جديد: كوخ 16.00 م × 8.50 م (مع التراس) — نفس تقسيم صورة المرجع ونفس المقاسات المكتوبة:
#   - يسار: غرفة نوم الأطفال 4.00 × 4.00 قدام + حمام الأطفال 2.40 × 2.00 وراها + دولاب/خزانة + كاونتر مطبخ على الصالة.
#   - النص: الصالة (جلسة L + طعام) مفتوحة، والمدخل بالجدار الخلفي.
#   - يمين: غرفة النوم الرئيسية 4.50 × 4.00 قدام + غرفة ملابس 2.40 × 2.00 + حمام خاص 3.00 × 2.00 وراها.
#   - التراس بعرض الكوخ كامل قدام (عمق 2.14 م) ودرج عريض بالنص — المبنى 16.00 × 6.36 + التراس = 8.50 م.
# السقف: مسطح الشكل (ميل خفيف 3° للخلف، صاج + عزل مائي) ممتد فوق التراس كامل على 4 أعمدة (طلب المصنع).
# الإحداثيات على محور الجدار، الجدار 12 سم (المقاس الخارجي 16.00 × 6.36)، +y = الخلف، التراس جنوب.
