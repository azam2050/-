# تصميم جلسة شتوية لبلكونة قائمة (فيديو من صاحب المصنع) — مو كوخ، جلسة بس داخل البلكونة الموجودة.
#   البلكونة ≈ 2.80 × 1.50 م (حسب صاحب المصنع): بلاط رمادي فاتح، درابزين زجاج، باب سحاب أسود، جدار حجر.
# فكرة التصميم الشتوي (مساحة صغيرة):
#   - جلسة أرضية L (جلسة عربية) على الجدار والطرف الغربي بمساند ومخدات + سجادة سدو دافية.
#   - طاولة خشب صغيرة بالنص عليها فانوس شمع (جو شتوي دافي).
#   - جدار شرائح خشب خلف الجلسة بأبليك ولوحة صغيرة، وفوانيس أرضية بالركن.
#   - ممر باب السحاب (الطرف الشرقي) فاضي بالكامل.
# البلكونة مرفوعة 3.00 م (دور أول) — البيت بالمشروع مجرد خلفية (جدار البلكونة) — اللقطات من داخل البلكونة فقط.
# الإحداثيات بالسنتيمتر، +y = داخل البيت، البلكونة جنوب.
name: balcony-winter-majlis
