# عميل الهدا: كوخ A-frame مساحته 25 م² (5.00 × 5.00) — الواجهة كاملة زجاج
#  الأرضي: صالة (ارتفاع مزدوج تطل على الواجهة الزجاج) + مطبخ أمريكي + دورة مياه
#  غرفة النوم: نص دور (ميزانين) فوق الجزء الخلفي، ودرجها خارجي يطلع على برندة/بلكونة خلفية
#  والدخول للغرفة من باب في مثلث الجملون الخلفي (حسب ورقة العميل).
# الميل 55°: المداد 471 سم من طبلية 480 بدون وصلات، والقمة 5.57 م.
# الجدار الجانبي 2.00 م (الرفرف ينزل لـ 1.71 — الشبابيك الجانبية رؤوسها ≤ 1.55) — الميزانين على +2.45 فوق مستوى الجدار (الارتفاع الصافي ≥ 1.90 م بالوسط 1.70 م عرض).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: aframe-alhada-25
title: كوخ A-frame بواجهة زجاج + ميزانين — 25 م²
client: "عميل — الهدا"
meta:
  location: الهدا
  usage: استراحة / سكن
  date: 2026-10-18
  price_note: ""
  price_scope: building
  hide_pricing: true          # السعر يُحدد بعد اعتماد المخطط
style: {preset: walnut_black, wood: natural_pine, railing: B04, window_grid: none, door_style: french, frame: wood_dark}
wall_height: 200
height_exact: true
slab_height: 45
roof: {ridge_axis: y, pitch_deg: 55, overhang: 20}
insulation: false
cladding_board_length: 400
pallet_length: 320

walls:
  - name: جنوب
    title: الواجهة الأمامية
    glass_front: true
    start: [0, 0]
    end: [488, 0]
    openings:   # زجاج كامل: مثلث علوي لوح واحد + لوحين تحت + باب زجاج بالوسط
      - {kind: window, code: ز1, name: زجاج ثابت يسار, offset: 6, width: 185, height: 200, sill: 10, style: fixed}
      - {kind: door, code: ب1, name: ب1 باب زجاج بإطار خشب, offset: 199, width: 90, height: 210, leaves: 1}
      - {kind: window, code: ز1, name: زجاج ثابت يمين, offset: 297, width: 185, height: 200, sill: 10, style: fixed}
  - name: شرق
    title: الواجهة الشرقية
    start: [488, 0]
    end: [488, 488]
    openings:
      - {kind: window, code: ش1, name: ش1 الصالة, offset: 60, width: 100, height: 85, sill: 65, grid: [2, 2]}
      - {kind: window, code: ش2, name: ش2 المطبخ, offset: 330, width: 90, height: 50, sill: 105, grid: [2, 1]}
  - name: شمال
    title: الواجهة الخلفية
    start: [488, 488]
    end: [0, 488]
    gable_openings:   # باب غرفة النوم (الميزانين) على البلكونة الخلفية — داخل مثلث الجملون
      - {code: ب3, name: ب3 باب غرفة النوم للبلكونة, offset: 199, width: 90, height: 200, sill: 245, grid: [2, 4]}
  - name: غرب
    title: الواجهة الغربية
    start: [0, 488]
    end: [0, 0]
    openings:
      - {kind: window, code: ش3, name: ش3 دورة المياه, offset: 90, width: 60, height: 40, sill: 115}
      - {kind: window, code: ش1, name: ش1 الصالة, offset: 328, width: 100, height: 85, sill: 65, grid: [2, 2]}
  - name: جدار دورة المياه
    exterior: false
    height: 220
    start: [180, 488]
    end: [180, 222]
    openings:
      - {kind: door, code: ب2, name: ب2 دورة المياه, offset: 180, width: 70, height: 205}
  - {name: دورة المياه جنوب, exterior: false, height: 220, start: [0, 222], end: [180, 222]}

rooms:
  - {name: الصالة, rect: [6, 6, 482, 216], label: [244, 180]}
  - {name: المطبخ الأمريكي, rect: [186, 228, 482, 482], label: [300, 330]}
  - {name: دورة مياه, rect: [6, 228, 174, 482], wet: true}

mezzanines:
  - name: غرفة النوم (نص دور)
    rect: [6, 222, 482, 482]
    level: 245
    railing: [S]
    headroom: [159, 329]
    railing_span: [100, 388]     # بين هذي الحدود السقف أعلى من الدربزين (برا منها السقف المائل يقفل)

decks:
  - name: عتبة المدخل
    rect: [174, -126, 314, -6]
    height: 45
    railing: []
    stairs: {side: S, offset: 0, width: 140}
  - name: البلكونة الخلفية
    rect: [104, 494, 384, 614]
    level: 245
    railing: [N, E]
    railing_style: vertical_balusters

straight_stairs:   # الدرج الخارجي للبلكونة الخلفية (ملاحظة العميل)
  - {name: الدرج الخارجي للبلكونة, start: [-271, 524], dir: E, width: 90, rise: 290, riser: 18, tread: 25, z0: -45, rail: N}

posts:   # أعمدة خشب تحمل البلكونة الخلفية
  - {at: [384, 606], size: 15, top: 245, base: -45}
  - {at: [112, 606], size: 15, top: 245, base: -45}

furniture:
  # الصالة: جلسة على الجدار الغربي + كرسي، الممر من الباب للمطبخ فاضي
  - {name: كنبة 3 مقاعد, rect: [6, 20, 96, 210]}
  - {name: طاولة, rect: [130, 80, 200, 150]}
  - {name: كرسي, rect: [390, 40, 470, 120]}
  # المطبخ الأمريكي (تحت الميزانين — ارتفاع صافي 2.20)
  - {name: ثلاجة, rect: [417, 228, 482, 293]}
  - {name: كاونتر, rect: [422, 293, 482, 482]}
  - {name: كاونتر, rect: [270, 422, 422, 482]}
  # دورة المياه
  - {name: دش, rect: [6, 392, 96, 482], shape: shower}
  - {name: "", rect: [130, 432, 170, 482], shape: wc}
  - {name: "", rect: [6, 236, 52, 286], shape: basin}
  # الميزانين (floor: -1 + z = منسوب أرضية الميزانين)
  - {name: سرير 160×200, rect: [164, 232, 324, 432], floor: -1, z: 245}
  - {name: "", rect: [118, 236, 158, 276], floor: -1, z: 245}
  - {name: "", rect: [330, 236, 370, 276], floor: -1, z: 245}
