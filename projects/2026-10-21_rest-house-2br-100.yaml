# عميل جديد — استراحة 100 م² (رسالة العميل): غرفتين + مطبخ + حمامين + صالة كبيرة.
# المقاس الخارجي 8.00 × 12.50 = 100 م² — دور واحد، سقف جملون + تراس أمامي مسقوف.
#  - الصالة الكبيرة على الواجهة بعرض الكوخ كامل (7.76 × 4.58 = 35.5 م²): جلسة + طاولة طعام جنب باب المطبخ.
#  - باب ممر عائلي من الصالة (الضيف ما يشوف الغرف)، والممر يخدم الغرفتين والحمامين.
#  - الغرف 3.28 × 3.68 و 3.28 × 3.76 (≥ 3.20 × 3.60) — رأس السرير على جدار مصمت وممر ≥ 60 حول السرير.
#  - المطبخ بابه من الصالة (يخدم الجلسة) + باب خدمة جانبي. الحمامين على الجدار الشرقي الخارجي (شباك جانبي مو على الواجهة).
# الميل 30°: المداد 508 سم (رفرف 40) من طبلية 520 بدون وصلات.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
