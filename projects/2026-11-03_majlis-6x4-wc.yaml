# عميل جديد (مخطط مرجعي + رسالة): مجلس منفصل 6 × 4 بمدخل ودورة مياه (مع كوخ 9×9 — 2026-11-03_cabin-9x9-3br.yaml).
# تعديل المصنع: «المجلس 4 × 6 واجهة زجاج» ← المجلس بالعرض (6 م قدام × 4 م عمق) وكامل واجهته الأمامية 6 م زجاج.
# المبنى 6.00 × 6.00 = 36 م²:
#  - المجلس 6.00 × 4.00 بالقدام بجلسة U متصلة (غرب + خلف + على الزجاج)، والطرف الشرقي فاضي لباب الزجاج (ما يقطع الجلسة).
#  - الشريحة الخلفية 1.88 م: ممر خدمة بمغسلة + كاونتر ضيافة (قهوة/شاي يخدم المجلس) ودورة مياه بالركن الشرقي على جدارين خارجيين.
#    بابها من ركن المجلس الخلفي الشرقي — بعيد عن الجلسة.
#  - الواجهة: زجاج ثابت بإطار أسود نحيف + باب زجاج بالركن الشرقي + مثلث الجملون زجاج، والسقف ممتد 1.50 م قدام على عمودين.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: majlis-6x4-wc
