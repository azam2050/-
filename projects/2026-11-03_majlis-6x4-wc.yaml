# عميل جديد (مخطط مرجعي + رسالة): مجلس منفصل 6 × 4 بمدخل ودورة مياه (مع كوخ 9×9 — 2026-11-03_cabin-9x9-3br.yaml).
# التصميم على المرجع: المبنى 6.00 × 6.00 = 36 م²:
#  - المجلس 4.00 × 6.00 صافي بجلسة U متصلة (غرب + خلف + أمام)، الباب على الجهة الشرقية من المدخل (ما يقطع الجلسة)،
#    وثلاث شبابيك: قدام + غرب + شباك قوسي بالجدار الخلفي (مثل المرجع) فوق الجلسة.
#  - الشريحة الشرقية 1.88 م: مدخل 1.88 × 2.30 تقريباً (مغسلة + جزامة) ومنه دورة مياه 1.88 × 1.70 بالخلف على جدار خارجي.
#  - مظلة المدخل: السقف ممتد 1.50 م قدام فوق عتبة المدخل.
# السقف: جملون 30° محوره بالعمق (المثلث على الواجهة) وممتد للأمام على عمودين — جلسة صغيرة قدام المجلس.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: majlis-6x4-wc
title: مجلس خشب منفصل 4.00 × 6.00 م بمدخل ودورة مياه — المبنى 6.00 × 6.00 م
client: "عميل — مجلس منفصل"
