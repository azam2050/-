# عميل جديد: مجلس منفصل بمدخل ودورة مياه — على المخطط المرجعي اللي أرسله المصنع (MAJLIS FLOOR PLAN 1:50):
#  - المجلس 4.00 × 6.00 م، والشريحة الجانبية 2.00 م بعمق 4.00 م بالخلف فقط (دورة مياه 1.70 + مدخل 2.30)،
#    والركن الأمامي 2 × 2 م مدخل مسقوف (المبنى شكل L) — نفس المرجع.
#  - الواجهة الأمامية كاملة زجاج بإطار أسود نحيف (طلب المصنع): واجهة المجلس 4 م + باب المدخل زجاج وجنبه زجاج ثابت.
#  - الجلسة U (غرب + قدام على الزجاج + شرق) بالنص الأمامي مثل المرجع، والنص الخلفي: دولاب/تلفزيون + شباك خلفي.
#  - المدخل: باب على الركن المسقوف ← صالة مدخل بمغسلة وجزامة ← باب للمجلس من ورا الجلسة (ما يقطعها) + باب دورة المياه.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
