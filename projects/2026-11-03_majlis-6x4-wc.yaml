  - name: شمال
    title: الواجهة الخلفية
    start: [600, 600]
    end: [0, 600]
    openings:
      - {kind: window, code: ش2, name: ش2 شباك المجلس الخلفي, offset: 340, width: 130, height: 150, sill: 80, grid: [3, 4]}
  - name: غرب
    title: الواجهة الغربية
    start: [0, 600]
    end: [0, 0]
    openings:
      - {kind: window, code: ش1, name: ش1 المجلس, offset: 220, width: 160, height: 150, sill: 70, grid: [3, 3]}
  - name: جدار المجلس الشرقي
    exterior: false
    start: [406, 0]
    end: [406, 600]
    openings:
      - {kind: door, code: ب2, name: ب2 المدخل — المجلس, offset: 120, width: 90, height: 220}
  - name: جدار دورة المياه
    exterior: false
    start: [406, 424]
    end: [600, 424]
    openings:
      - {kind: door, code: ب3, name: ب3 دورة المياه, offset: 30, width: 70, height: 210}

