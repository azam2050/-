# عميل جديد (رسالة + فويس): دورين — تحت: صالون (صالة عائلة) + مطبخ + مجلس + دورة مياه، فوق: غرفتين نوم + صالة صغيرة + دورتين مياه.
# الفويس: "تصميم محترم بواجهات زجاجية وشرفة، منظر جمالي مو صندوق مصمت". المقاس ما وصل ← مقترح 12.00 × 9.00 (108 م² للدور).
#  الأرضي: المجلس قدام غرب بمدخل ضيوف مستقل على ركنه (الجلسة U متصلة) + ممر مغاسل خلفه يوصل لدورة المياه والمطبخ
#          (المطبخ يخدم المجلس والصالون). الصالون قدام شرق بواجهة زجاج سحاب على التراس، ومدخل العائلة من الشرق جنب الدرج.
#  الأول: غرفة ماستر قدام غرب (ملابس + حمام خاص) وغرفة 2 قدام شرق، بينهم صالة صغيرة كلها على الشرفة بزجاج سحاب،
#         حمام 2 + غسيل بالخلف على الممر. الحمامات على جدار خارجي (حمام الماستر فوق دورة مياه الأرضي).
# السقف: جملون 30° محوره بالعمق بمثلث زجاج كامل بالواجهة، ممتد 2.20 م قدام فوق الشرفة على 4 أعمدة (تظليل الزجاج).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
