# مشروع استثماري (عميل جديد): أرض 25 × 36 م = 900 م² — الواجهة 25 م على الشارع (ملاحظة المصنع الصوتية).
#  1) تقسيم احترافي للأرض: 3 وحدات متساوية بعرض 8.20 م صافي × 36 م، جدران فاصلة 2.50 م للخصوصية،
#     وكل وحدة لها بوابة سيارة + باب مشاة مستقل على الشارع.
#  2) تصميم الكوخ الاستثماري (يتكرر في الوحدات الثلاث): دور واحد 7.00 × 11.00 = 77 م²:
#     صالة + مطبخ تحضيري تطل على المسبح، غرفتين نوم كل غرفة بدورة مياه خاصة (دورتين مياه)،
#     وتراس أمامي مسقوف (السقف ممتد 2.40 م على أعمدة خشب).
#  3) لاندسكيب لكل وحدة: مسبح 3.50 × 7.00، جلسة خارجية تحت برجولة، كراسي استلقاء، حديقة بأشجار، موقف وممر.
# الإحداثيات على محور الجدار للوحدة الأولى (الغربية)، الجدار 12 سم، +y = الخلف، الشارع جنوب.
