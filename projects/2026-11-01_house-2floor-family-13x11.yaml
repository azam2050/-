# عميل (تعديل الطلب — رسالة المصنع): بيت متكامل صغير دورين، أكبر غرفة 5 × 5 م.
#  تحت: استقبال + صالة + مطبخ + مخزن + غرفة بحمامها.  فوق: غرفة رئيسية بحمامها + صالة + غرفتين أطفال + غرفة عاملة "مثلاً".
#  (من الطلب السابق: واجهات زجاج + شرفة + شكل جمالي مو صندوق.)
# التصميم 13.00 × 11.00 داخلي تقريباً — ثلاث شرائح: غرب 5.00 | ردهة بالنص 3.00 | شرق 5.00:
#  الأرضي: الاستقبال 5×5 قدام غرب بمدخل ضيوف مستقل على ركنه + دورة مياه ضيوف من الردهة جنبه (بعيدة عن الجلسة).
#          المدخل الرئيسي بالنص على ردهة 3.00 م تنتهي بالدرج. الصالة 5×5 قدام شرق مفتوحة على الردهة وزجاج سحاب على التراس.
#          خلف: ممر ضيوف بمغسلة ← دورة مياه الضيوف (جدار خارجي) + غرفة الأرضي 3.50 × 3.88 بحمامها وملابسها (غرب)، المطبخ 5.00 × 2.88 (شرق) ومنه المخزن + غرفة العاملة
#          (العاملة جنب المطبخ بالأرضي بدل الدور العلوي — خصوصية دور النوم للعائلة).
#  الأول: الغرفة الرئيسية 5×5 قدام غرب بحمام + غرفة ملابس، الصالة 5×5 قدام شرق على الشرفة، الردهة بالنص على الشرفة،
#         غرفة طفل 1 (غرب) وطفل 2 (شرق) 5.00 × 3.88 بالخلف، حمام الأطفال على الجدار الشرقي.
#         حمام الرئيسية فوق حمام غرفة الأرضي.
# السقف (فكرة جديدة): جملون رئيسي محوره موازي للواجهة 25° + جملون متقاطع بارز فوق الردهة والصالة بمثلث زجاج،
#        ممتد 2.20 م قدام فوق الشرفة على عمودين — الواجهة مو صندوق: كتلة الرئيسية مستوية وكتلة الصالة بارزة بمثلث.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
