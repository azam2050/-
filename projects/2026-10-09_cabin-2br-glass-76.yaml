# تصميم رقم 5 (صورة العميل): كوخ دور واحد بسقف ممتد وواجهة زجاجية عريضة
# البرنامج: غرفتين نوم (ماستر بدورة مياه) + صالة واسعة + مطبخ أمريكي مفتوح + دورتين مياه — 10.00 × 7.60 = 76 م²
# السقف مائل باتجاه واحد بميل خفيف 10° (نفس اعتماد المجلس — صاج معدني) يرتفع للواجهة الزجاج والمويه تنزل للخلف.
# المداد قطعتين موصولة فوق الجدار الداخلي الحامل (y=418) بتراكب 60 سم — أطول قطعة 512 سم من طبلية 520.
# دورتين المياه جنب بعض على الجدار الخلفي (سباكة من الخارج + شباك لكل حمام، وممنوع على الواجهة الأمامية).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: cabin-2br-glass-76
