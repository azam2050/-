# عميل (3 خيارات بمساحات مختلفة — رسالة واتساب) — الخيار 3 (الأصغر):
#  الأرضي: مجلس 4×4 + صالة 4×4 + مطبخ صغير (3×2 مفتوح على الصالة) + مستودع + دورتين مياه + درج.
#  العلوي: غرفة نوم 4×4 + دورة مياه (فوق دورات المياه الأرضية)، والباقي سطح (حوش علوي) قدام.
# الأرضي 8.24 × 8.24 — العلوي 8.24 × 4.12 فوق الجزء الخلفي، والسطح 8.24 × 4.12 على الواجهة.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: option3-1br-majlis
title: الخيار 3 — مجلس وصالة + غرفة — دورين بسطح علوي
client: "عميل — 3 خيارات"
