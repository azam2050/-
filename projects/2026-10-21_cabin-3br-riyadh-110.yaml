# تصميم رقم 5 — تعديل 2 (عميل الرياض): تصغير الكوخ من 144.5 إلى 110.5 م² للتكلفة (رسالة المصنع الصوتية + الإيميل):
#  - العرض 13.00 م بدل 17.00 (العمق 8.50 نفسه) = 110.5 م².
#  - الماستر: الضلع الخلفي 4 م (× 5 م عمق) مع حمامه.
#  - غرفة 2 تصير ماستر: الحمام اللي جنبها بابه من داخل الغرفة.
#  - غرفة 2 وغرفة 3: الضلع الخلفي 3 م (بدل 4) — السرير 160 بممر 64 سم من الجهتين.
#  - حمام ثالث جنب المطبخ 1.50 م على الجدار الأيسر (الغربي) × 2.00 م لداخل الكوخ — يخدم الصالة وغرفة 3.
# السقف مائل باتجاه واحد 10° صاج يرتفع للواجهة (نفس التصميم المعتمد)، المداد قطعتين موصولة فوق جدار الغرف (y=418).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
