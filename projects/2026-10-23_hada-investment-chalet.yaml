notes:
  - "شاليهين متطابقين دورين — الأرضي: صالة 6.76 × 4.48 م بسحابات زجاج + مطبخ مفتوح + حمام يخدم الصالة + درج خشب."
  - "بارتشن خشب بالصالة (تحت جدار الغرفتين بالعلوي) يشيل الدور الثاني ويقسم الصالة: جلسة وتلفزيون غربه، وطعام ومدخل شرقه — وجسر خشب فوق الفتحة بينه وبين الواجهة."
  - "الأول: ماستر 3.40 × 4.48 م بغرفة ملابس وحمام خاص، وغرفة 2 بمقاس 3.24 × 4.48 م وحمام يخدمها — والغرفتين على البلكونة."
  - "البلكونة 7.00 × 2.40 م فوق التراس، مسقوفة بامتداد السقف على 4 أعمدة خشب من الأرض للسقف، ومثلث زجاج بالجملون."
  - "الحمامات فوق بعض وعلى جدار خارجي، وشبابيكها خلفية/جانبية (مو على الواجهة)."
  - "غرف النوم بالدور العلوي مقفلة بجدران وأبواب على الممر — اللي بالصالة ما يشوف الغرف."
