# تصميم الهدا (الطائف) — استثماري: شاليه خشب للتأجير + تقسيم اللاندسكيب.
# الأرض شبه منحرف (رسمة المصنع): الواجهة على الشارع 24.27 م، الجنبين 25.00 م، الخلف 16.23 م ≈ 500 م².
# المطلوب: غرفتين وصالة — ماستر واحد (بحمامه) وحمام يخدم الغرفة الثانية والصالة — مع شرفة جميلة.
# الشاليه 8.24 × 13.72 م = 113 م² (دور واحد) + شرفة أمامية مسقوفة 8.24 × 2.40 م:
#  - الصالة والمطبخ المفتوح على الواجهة (8.00 × 5.48) بسحابات زجاج ومثلث زجاج بالجملون يطل على الحديقة والمسبح.
#  - باب ممر عائلي من الصالة: الممر يخدم الغرفة 2 والحمام والمستودع، وباب الماستر بآخر الممر (خصوصية).
#  - الماستر 5.08 × 3.88 بغرفة ملابس وحمام خاص (الحمام على جدار خارجي، شباكه جانبي مو على الواجهة).
#  - الغرفة 2: 3.68 × 3.88 (≥ 3.20 × 3.60) — رأس السرير على جدار مصمت وممر ≥ 60 حول السرير.
# السقف جملون 30° محوره عمودي على الواجهة (الجملون يطل على الحديقة) — المداد 516 سم من طبلية 520، ممتد 2.40 م فوق الشرفة.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب (جهة الشارع).
