# تصميم الهدا (الطائف) — استثماري: شاليهين خشب دورين للتأجير + تقسيم اللاندسكيب بجلسة شتوية.
# الأرض شبه منحرف (رسمة المصنع): الواجهة على الشارع 24.27 م، الجنبين 25.00 م، الخلف 16.23 م ≈ 500 م².
# الأرض تنقسم بسور بالنص لوحدتين مستقلتين (≈ 250 م² لكل وحدة): بوابة سيارة + باب مشاة + موقف + مسبح غطس
#   + جلسة شتوية بمشب تحت برجولة + حديقة — تأجير مستقل وخصوصية كاملة.
# الشاليه دورين (طلب المصنع: نستفيد من الأرض للاندسكيب): بصمة 7.00 × 9.00 م بدل 7.00 × 12.62 — الحوش الأمامي صار 11.3 م.
#  الأرضي: صالة ومطبخ مفتوح + حمام يخدم الصالة + الدرج.
#  الأول: الماستر (بغرفة ملابس وحمام خاص) + غرفة 2 + حمام يخدم الغرفة 2 — والغرفتين على بلكونة أمامية تطل على الحديقة.
#  الحمامات فوق بعض (الحمامين على الجدار الشمالي)، وشبابيكها على الجدار الخلفي/الجانبي مو على الواجهة.
#  غرفة النوم بالدور العلوي مقفلة بجدار وباب (ما تنكشف على الصالة).
# السقف جملون 30° محوره عمودي على الواجهة — المداد 444 سم (أقل من طبلية 520)، ممتد 2.40 م فوق البلكونة على 4 أعمدة.
# الوحدة الثانية = نفس الشاليه مزاح 8.40 م (site.units).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب (جهة الشارع).
