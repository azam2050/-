# تصميم الهدا (الطائف) — استثماري: شاليهين خشب للتأجير + تقسيم اللاندسكيب.
# الأرض شبه منحرف (رسمة المصنع): الواجهة على الشارع 24.27 م، الجنبين 25.00 م، الخلف 16.23 م ≈ 500 م².
# الأرض تنقسم بسور بالنص لوحدتين مستقلتين (≈ 250 م² لكل وحدة): كل وحدة لها بوابة سيارة + باب مشاة + موقف
#   + مسبح غطس + حديقة — تأجير مستقل وخصوصية كاملة بين الوحدتين.
# كل شاليه: غرفتين وصالة — ماستر واحد (بغرفة ملابس وحمام) وحمام يخدم الغرفة الثانية والصالة — مع شرفة مسقوفة.
# الشاليه 7.00 × 12.62 م = 88.3 م² (دور واحد) + شرفة 7.00 × 2.40 م:
#  - الصالة والمطبخ المفتوح على الواجهة (6.76 × 4.48) بسحابات زجاج ومثلث زجاج بالجملون.
#  - باب ممر عائلي من الصالة: الممر يخدم الغرفة 2 والحمام والمستودع، والماستر بآخر الممر (خصوصية).
#  - الغرفة 2: 3.28 × 3.68 (≥ 3.20 × 3.60)، الماستر 4.38 × 3.98.
# السقف جملون 30° محوره عمودي على الواجهة — المداد 444 سم (أقل من طبلية 520)، ممتد 2.40 م فوق الشرفة.
# الوحدة الثانية = نفس الشاليه مزاح 8.40 م (site.units) — الشاليهين بنفس البعد عن السور الأوسط والسور المائل.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب (جهة الشارع).
