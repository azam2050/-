notes:
  - "تجهيز تكييف: تمديدات مكيف سبليت لكل غرفة وللصالة والعلّية (مواسير نحاس + تصريف + فيش 20 أمبير)."
  - "تجهيز إنارة: سبوتات بالأسقف، إنارة مخفية تحت حافة العلّية، ومخارج إنارة خارجية عند المدخلين."
