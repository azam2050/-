  - {name: كاونتر جزيرة, rect: [560, 140, 640, 340]}
  # غرفة 1: رأس السرير على الفاصل المصمت (مو تحت الشباك)
  - {name: سرير 140×200, rect: [70, 482, 210, 682]}
  - {name: دولاب, rect: [6, 776, 186, 830]}
  # غرفة 2
  - {name: سرير 140×200, rect: [80, 982, 220, 1182]}
