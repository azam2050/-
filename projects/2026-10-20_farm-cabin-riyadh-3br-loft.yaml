# عميل جديد — كوخ سكن في مزرعة (الرياض). المطلوب (رسالة العميل):
#   3 غرف نوم + دورتين مياه + صالة جلوس تتسع لـ 10 أشخاص + مطبخ + مستودع + غرفة نوم بالدور العلوي بدورة مياه،
#   مدخلين، استغلال الإضاءة الطبيعية والمساحات، تكلفة اقتصادية، تجهيز تكييف وإنارة.
# تعديل 2 (ملاحظات المصنع): غرف أوسع (3.30 × 3.60) بممر ≥ 55 سم حول السرير، الدرج بمكان أذكى (على الجدار الخلفي
#   للصالة وتحته تخزين)، الغرفة العلوية **مقفلة بجدار وباب** (خصوصية بالطابع الخليجي — ما تنكشف على الصالة)،
#   وباب للممر العائلي عشان الضيف في الصالة ما يشوف الغرف.
# دور أرضي 8.20 × 12.40 = 101.7 م² + غرفة علوية (علّية) داخل الجملون منسوب +2.90.
#   - الجملون للأمام بزجاج كامل فوق الصالة = إضاءة طبيعية.
#   - العلّية فوق الغرف الخلفية: غرفة نوم + دورة مياه في بروز خلفي، وتحت البروز المستودع (بابه من آخر الممر).
#   - مدخلين: الرئيسي من الواجهة للصالة + مدخل جانبي للمطبخ (شرق).
# الميل 33°: المداد 513 سم (رفرف 20) من طبلية 520 بدون وصلات.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: farm-cabin-riyadh-3br-loft
title: كوخ مزرعة — 3 غرف + غرفة علوية — 8.20 × 12.40
client: "عميل — مزرعة الرياض"
meta:
  location: الرياض (مزرعة)
  usage: سكن
  date: 2026-10-20
  price_note: ""
  price_scope: building
  hide_pricing: true          # السعر يُحدد بعد اعتماد المخطط
style: {preset: walnut_black, wood: natural_pine, railing: B04, window_grid: none, door_style: french, frame: wood_dark}
wall_height: 280
slab_height: 45
roof: {ridge_axis: y, pitch_deg: 33, overhang: 20}
insulation: true
cladding_board_length: 400
pallet_length: 320

