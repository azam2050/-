    wall_doors: {S: [[360, 440]]}  # باب الغرفة على البسطة
    headroom: [333, 475]

straight_stairs:   # على الجدار الخلفي للصالة: 14 قائمة × 20.7 ونائمة 23 — يطلع لبسطة قدام باب الغرفة العلوية، وتحته تخزين
  - {name: درج الغرفة العلوية, start: [30, 380], dir: E, width: 90, rise: 290, riser: 20.7, tread: 23, rail: S}

