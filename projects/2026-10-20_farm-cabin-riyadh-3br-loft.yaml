    rect: [6, 476, 782, 1182]
    level: 290
    railing: [S]
    headroom: [308, 480]
    railing_span: [151, 637]
    holes:   # فتحة الدرج + دربزين (مفتوحة من جهة الوصول بالشمال)
      - {rect: [308, 665, 410, 906], railing: [S, E, W]}

straight_stairs:   # مستقيم في الممر: 14 قائمة × 20.7 ونائمة 23 — يطلع للعلّية وجهك للغرفة
  - {name: درج العلّية, start: [314, 600], dir: N, width: 90, rise: 290, riser: 20.7, tread: 23, rail: E}

bumps:   # البروز الخلفي: دورة مياه الغرفة العلوية فوق، والمستودع تحتها (بابه من آخر الممر)
  - {wall: شمال, offset: 304, width: 180, depth: 200, base: -45, floor_z: 290, eave: 490, pitch: 40, overhang: 12,
     name_up: دورة مياه الغرفة العلوية, name_down: مستودع, door_h: 0}

decks:
