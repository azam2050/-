    openings:
      - {kind: window, code: ش1, name: ش1 الجلسة, offset: 60, width: 220, height: 160, sill: 60, grid: [3, 3]}
      - {kind: door, code: ب1, name: ب1 المدخل الرئيسي, offset: 354, width: 100, height: 225, leaves: 1, grid: [2, 5]}
      - {kind: window, code: ش1, name: ش1 المطبخ, offset: 520, width: 190, height: 160, sill: 60, grid: [3, 3]}
  - name: شرق
    title: الواجهة الشرقية
    start: [808, 0]
    end: [808, 1228]
    openings:
      - {kind: window, code: ش2, name: ش2 المطبخ, offset: 120, width: 120, height: 100, sill: 110, grid: [2, 2]}
      - {kind: door, code: ب2, name: ب2 المدخل الجانبي (المطبخ), offset: 350, width: 90, height: 215, leaves: 1, grid: [2, 5]}
      - {kind: window, code: ش4, name: ش4 غرفة 3, offset: 560, width: 100, height: 120, sill: 90, grid: [2, 3]}
      - {kind: window, code: ش3, name: ش3 دورة مياه 1, offset: 900, width: 60, height: 60, sill: 150}
      - {kind: window, code: ش3, name: ش3 دورة مياه 2, offset: 1090, width: 60, height: 60, sill: 150}
  - name: شمال
    title: الواجهة الخلفية
    start: [808, 1228]
    end: [0, 1228]
    openings:   # باب المستودع (داخل البروز) من آخر الممر
      - {kind: door, code: ب4, name: ب4 المستودع, offset: 375, width: 70, height: 205}
    gable_openings:   # باب دورة مياه الغرفة العلوية (منسوب العلّية)
      - {code: ب5, name: ب5 دورة مياه الغرفة العلوية, offset: 369, width: 70, height: 200, sill: 290, grid: [2, 4]}
  - name: غرب
    title: الواجهة الغربية
    start: [0, 1228]
    end: [0, 0]
    openings:
      - {kind: window, code: ش4, name: ش4 غرفة 2, offset: 78, width: 80, height: 120, sill: 90, grid: [2, 3]}
      - {kind: window, code: ش4, name: ش4 غرفة 1, offset: 540, width: 100, height: 120, sill: 90, grid: [2, 3]}
      - {kind: window, code: ش1, name: ش1 الجلسة, offset: 908, width: 180, height: 150, sill: 75, grid: [3, 3]}
  - name: فاصل الصالة
    exterior: false
    start: [0, 476]
    end: [808, 476]
    openings:   # باب الممر العائلي (خصوصية الغرف عن الصالة)
      - {kind: door, code: ب7, name: ب7 باب الممر العائلي, offset: 353, width: 90, height: 210}
  - name: جدار الممر الغربي
    exterior: false
    start: [342, 476]
    end: [342, 1228]
    openings:
      - {kind: door, code: ب3, name: ب3 غرفة 1, offset: 24, width: 80, height: 210}
      - {kind: door, code: ب3, name: ب3 غرفة 2, offset: 404, width: 80, height: 210}
  - {name: فاصل غرفة 1 و2, exterior: false, start: [0, 848], end: [342, 848]}
  - name: جدار الممر الشرقي
    exterior: false
    start: [454, 476]
    end: [454, 1228]
    openings:
      - {kind: door, code: ب3, name: ب3 غرفة 3, offset: 24, width: 80, height: 210, swing: right}
      - {kind: door, code: ب6, name: ب6 دورة مياه 1, offset: 404, width: 70, height: 210, swing: right}
      - {kind: door, code: ب6, name: ب6 دورة مياه 2, offset: 594, width: 70, height: 210, swing: right}
  - {name: فاصل غرفة 3, exterior: false, start: [454, 848], end: [808, 848]}
  - {name: فاصل الدورتين, exterior: false, start: [454, 1040], end: [808, 1040]}

