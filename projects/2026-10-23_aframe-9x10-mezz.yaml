# عميل جديد: كوخ A-frame 9.00 × 10.00 = 90 م² — مثل الصورة: واجهة زجاج كاملة بقواطع غامقة ومثلث خشب.
# المطلوب: صالة + غرفة + مطبخ أمريكي + حمام، مع ميزانين.
#  الأرضي: صالة بارتفاع مزدوج تطل على الزجاج (8.76 × 4.94) + درج مستقيم خشب يطلع للميزانين،
#          وتحت الميزانين: غرفة النوم مقفلة (غرب) + مطبخ أمريكي مفتوح على الصالة + الحمام (خلفي شرق) + مخزن.
#  الميزانين (+2.40): جلسة علوية/نوم إضافي مطلة على الزجاج بدربزين — 8.76 × 4.76، الوقفة الكاملة (≥ 2.00 م) بعرض 3.15 م بالنص.
# ملاحظة المصنع: قلّل الارتفاع — القمة = الجدار الجانبي + نص العرض (4.50) × ميل السقف: 2.30 + 4.50 × tan38° = 5.80 م.
#   المداد ≈ 6.2 م → جسر حامل (purlin) بكل جهة والمداد قطعتين ≤ طبلية 520.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: aframe-9x10-mezz
title: كوخ A-frame بواجهة زجاج + ميزانين — صالة وغرفة ومطبخ أمريكي وحمام — 9.00 × 10.00 م
client: "عميل — A-frame 9×10"
