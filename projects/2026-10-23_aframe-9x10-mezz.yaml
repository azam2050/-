      - {code: ش4, name: ش4 الميزانين, offset: 384, width: 120, height: 100, sill: 360, grid: [2, 2]}
  - name: غرب
    title: الواجهة الغربية
    start: [0, 988]
    end: [0, 0]
    openings:
      - {kind: window, code: ش1, name: ش1 غرفة النوم, offset: 100, width: 120, height: 90, sill: 60, grid: [2, 2]}
      - {kind: window, code: ش1, name: ش1 الصالة, offset: 668, width: 120, height: 90, sill: 60, grid: [2, 2]}
  - name: جدار الغرفة الأمامي
    exterior: false
    height: 228
    start: [0, 512]
    end: [406, 512]
    openings:
      - {kind: door, code: ب2, name: ب2 غرفة النوم, offset: 300, width: 80, height: 210}
  - {name: جدار الغرفة الجانبي, exterior: false, height: 228, start: [406, 512], end: [406, 988]}
  - name: جدار الحمام
    exterior: false
    height: 228
    start: [606, 788]
    end: [888, 788]
    openings:
