  - name: شرق
    title: الواجهة الشرقية
    start: [888, 0]
    end: [888, 988]
    openings:
      - {kind: window, code: ش1, name: ش1 الصالة, offset: 200, width: 120, height: 90, sill: 60, grid: [2, 2]}
