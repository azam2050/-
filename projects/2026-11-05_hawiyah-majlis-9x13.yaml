style: {preset: cedar_charcoal_porch, wood: honey_cedar, glass: clear, frame: black, railing: x_cross, window_grid: grid, door_style: french}
wall_height: 400
height_exact: true
slab_height: 45
# السقف المتداخل (مثل صورة المصنع): جملون بسطحين بمنسوبين — السطح الطويل فوق الجلسة أعلى ويركب فوق سطح الغرفة،
# وبينهم شريط خشب رأسي مقفل بطول المبنى عند خط التداخل (فوق جدار الجلسة/الغرفة)، ومثلث الواجهة زجاج بإطار خشب.
roof:
  ridge_axis: y
  pitch_deg: 20
  overhang: 50
  purlins: 1
  split: 550
  split_glass: false     # الشريط بين السطحين خشب مقفل (ملاحظة المصنع) — الزجاج بمثلثات الواجهة بس
insulation: true
cladding_board_length: 400
pallet_length: 320

