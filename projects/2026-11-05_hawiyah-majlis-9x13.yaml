# عميل الحوية — مرسوم بالضبط على المخطط اليدوي من المصنع (نفس التقسيم ونفس اتجاه الورقة: أعلى الورقة = أعلى المسقط):
#   - يسار فوق: غرفة نوم 2.50 × 6.00 م، وتحتها مستودع 2.50 × 2.00 م — أبوابهم وشبابيك الغرفة على الجلسة.
#   - يمين فوق: حوش (جلسة خارجية مغلقة) 6.50 × 8.00 م، بابه خشب على الواجهة العلوية — بدون زجاج (علامات X من المصنع).
#   - تحت: مجلس 7.00 × 5.00 م — باب وشباك على الجلسة، شباك على المستودع، شباك سفلي، ومشب على الجدار اليسار.
#   - يمين تحت: مغاسل 2.00 × 2.00 م (مفتوحة على الجلسة) + حمام 2.00 × 3.00 م بابه من المغاسل.
#   - الإجمالي 9.00 × 13.00 م، الجدران 4.00 م، السقف متداخل مثل صورة المصنع (الشريط بين السطحين خشب).
# الإحداثيات على محور الجدار، الجدار 12 سم. y = 1300 = أعلى الورقة (واجهة المدخل)، x = 0 = يسار الورقة.
name: hawiyah-majlis-9x13
title: مجلس وجلسة خارجية مغلقة وغرفة نوم 9.00 × 13.00 م — الحوية
client: "عميل — الحوية"
meta:
  location: الحوية
  usage: مجلس ضيافة + جلسة مغلقة + غرفة نوم
  date: 2026-11-05
  price_note: ""
  price_scope: building
  hide_pricing: true
style: {preset: cedar_charcoal_porch, wood: honey_cedar, glass: clear, frame: black, railing: x_cross, window_grid: grid, door_style: panel}
wall_height: 400
height_exact: true
slab_height: 45
# السقف المتداخل: السطح الكبير فوق الجلسة أعلى ويركب فوق سطح الغرفة/المستودع، والشريط بينهم خشب مقفل.
roof:
  ridge_axis: y
  pitch_deg: 20
  overhang: 50
  purlins: 1
  split: 250
  split_glass: false
  soffit: true        # سقف داخلي خشب أملس مقفل تحت المدادات
insulation: true
cladding_board_length: 400
pallet_length: 320

walls:
  - name: الواجهة العلوية
    title: واجهة المدخل (أعلى المخطط)
    start: [900, 1300]
    end: [0, 1300]
