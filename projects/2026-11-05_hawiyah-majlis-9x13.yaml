# عميل جديد (الحوية): مخطط يدوي من المصنع + صورة مرجعية للطابع (خشب عسلي، واجهة زجاج بمثلث زجاج، شرفة بدربزين X).
# المخطط اليدوي (أعلى الورقة = الواجهة):
#   - جلسة خارجية مغلقة 5.50 × 8.00 م: بابها على الواجهة، ومشب على جدارها الجانبي.
#   - غرفة نوم 3.50 × 6.00 م + مستودع 3.50 × 2.00 م جنب الجلسة، أبوابهم من الجلسة.
#   - مجلس 7.00 × 5.00 م ورا الجلسة: بابه وشباك من الجلسة، مشب على جداره الجانبي، وشباك خلفي.
#   - شريحة 2.00 م: مغاسل 2.00 + حمام 3.00 جنب المجلس (باب المغاسل من المجلس).
#   - الإجمالي 9.00 × 13.00 م، ارتفاع السقف 4 م، والسقف "متداخل".
# مراجعة المصمم: شبابيك غرفة النوم على جدار خارجي (مو على الجلسة) للخصوصية والتهوية، ورأس السرير على جدار مصمت.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب (y = 0). المخطط مرسوم بنفس اتجاه الورقة بعد تدويرها.
name: hawiyah-majlis-9x13
title: مجلس وجلسة خارجية مغلقة وغرفة نوم 9.00 × 13.00 م — الحوية
