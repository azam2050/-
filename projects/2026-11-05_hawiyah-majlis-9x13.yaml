      - {kind: door, code: ب2, name: ب2 غرفة النوم, offset: 500, width: 90, height: 220}
      - {kind: window, code: ش1, name: ش1 الغرفة على الجلسة, offset: 660, width: 100, height: 120, sill: 100, grid: [2, 2]}
  - {name: جدار الغرفة — المستودع, exterior: false, start: [0, 700], end: [250, 700]}
  - name: جدار المجلس العلوي
    exterior: false
    start: [0, 500]
    end: [700, 500]
    openings:
      - {kind: window, code: ش2, name: ش2 المجلس على المستودع, offset: 80, width: 80, height: 100, sill: 120, grid: [1, 2]}
      - {kind: door, code: ب4, name: ب4 المجلس, offset: 310, width: 100, height: 230}
      - {kind: window, code: ش3, name: ش3 المجلس على الجلسة, offset: 510, width: 100, height: 150, sill: 90, grid: [2, 3]}
  - {name: جدار المجلس — المغاسل والحمام, exterior: false, start: [700, 0], end: [700, 500]}
  - name: جدار المغاسل — الحمام
    exterior: false
