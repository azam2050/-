style: {preset: cedar_charcoal_porch, wood: honey_cedar, glass: clear, frame: black, railing: x_cross, window_grid: grid, door_style: french}
wall_height: 400
height_exact: true
slab_height: 45
# السقف المتداخل: جملون رئيسي بطول المبنى + جملونين متقاطعين بارزين يتداخلون معه (فوق الجلسة وفوق المجلس) + مثلث زجاج على الواجهة
