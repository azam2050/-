# تصميم رقم 5 — خيار 3 غرف (عميل الرياض) — تعديل المصنع على خيار 98.8 م²:
#  غرفة الماستر لا تقل عن 5 × 5 م (طلب العميل)، الغرفتين 4 × 4 م، المطبخ ينتقل للجهة الغربية (4 × 4) مكان العلامة.
# المقاس 17.00 × 8.50 = 144.5 م². الواجهة الأمامية زجاج كامل، السقف مائل باتجاه واحد 10° صاج معدني يرتفع للواجهة.
# المداد قطعتين موصولة فوق جدار الغرف (y=418) — أطول قطعة ≤ 520 (طبلية).
# الحمامين جنب بعض على الجدار الخلفي (شباك لكل حمام، وما فيه شباك حمام على الواجهة).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
