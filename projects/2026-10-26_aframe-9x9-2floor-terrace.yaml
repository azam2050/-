# عميل جديد (ورقة ملاحظات): كوخ A-frame دورين 9.00 × 9.00 — نفس طريقة الـ A-frame الحاد (السقف لين الأرض).
#   الأرضي: صالة + مطبخ (خلفي يمين) + حمام 2.50 × 2.50 (خلفي يسار) + مغسلة 0.90 جنبه + الدرج قدام الحمام.
#   الأول (+2.90): حمام (خلفي يسار) + غرفتين يمين، و"شرفة داخلية" بعد الزجاج ترجع 1.20 م —
#   يعني أرضية الدور الأول توقف قبل الواجهة بـ 1.20 (فراغ مزدوج) واللي فوق يشوف الصالة من جوا الكوخ. الواجهة كلها زجاج.
# القمة ≈ 9.00 م: قاعدة 15 سم + ميل 63° (0.15 + 4.50 × tan63 ≈ 8.98).
#   - الأول: الأرضية من حيث بطن السقف ≥ 2.90 (x 160..728)، الوقفة الكاملة بالنص x 251..637.
#   - الدرج مستقيم يطلع من قدام (جنب المدخل) للخلف ويوصل لممر بين الشرفة والغرف — الغرف مقفلة بجدار وباب.
#   المداد = 4.50 / cos63 + 0.10 ≈ 10.0 م → 3 جسور حاملة بكل جهة والمداد 3 قطع ≤ طبلية 520.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
