  - "نفس تقسيم شاليه الهدا: الأرضي صالة بسحابات زجاج + مطبخ مفتوح + حمام + درج خشب، والأول ماستر بغرفة ملابس وحمام + غرفة 2 وحمامها."
  - "مساحة أكبر (طلب المصنع): المبنى 10.60 × 9.00 م بالدورين — جناح شرقي 3.60 م."
  - "الأول: غرفة نوم 3 (3.48 × 4.48 م) بحمام خاص، على البلكونة الأمامية اللي امتدت بعرض المبنى 10.60 × 2.40 م."
  - "الأرضي: مجلس 3.48 × 4.54 م بابه من الصالة + دورة مياه المجلس + مخزن بباب خارجي."
