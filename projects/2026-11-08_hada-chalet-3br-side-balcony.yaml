# تصميم ثالث لنفس عميل الهدا: أرض جنب الأرض — كوخ واحد بنفس تقسيم شاليه الهدا المنشور (watad-wood.com/hada)،
# + مساحة أكبر (طلب المصنع): المبنى صار 10.60 × 9.00 م بالدورين (جناح شرقي 3.60 م):
#   الأول: غرفة نوم 3 على البلكونة الأمامية (البلكونة امتدت بعرض المبنى 10.60 م) + حمامها، والممر امتد لها.
#   الأرضي: مجلس بابه من الصالة + دورة مياه المجلس + غرفة شغالة (كانت المخزن) بابها من المطبخ وحمامها من الغرفة.
#   الأول: غرفة الشغالة صارت مطبخ (نفس الوضع).
#   السقف جملون واحد بعرض 10.60 (جسور حاملة) ممتد فوق البلكونة على أعمدة.
name: hada-chalet-3br-side-balcony
title: كوخ الهدا — دورين — 3 غرف نوم + مجلس + بلكونة — 10.60 × 9.00 م
client: "عميل — الهدا"
meta:
  location: الهدا — الطائف
  usage: كوخ سكني/استثماري
  date: 2026-11-08
  price_note: ""
  price_scope: building
  price_items:
    - {name: تراس الأرضي + البلكونة بالأول (10.60 × 2.40 × 2), qty: 50.88, unit: م², rate: 1096}
  terms:
    - "السعر للكوخ (الدورين) والتراس والبلكونات حسب المخطط المعتمد — التراس والبلكونة تُسعّر بنفس سعر متر الكوخ."
    - "أعمال الموقع (السور والبوابات والمسبح والجلسة الشتوية والبلاط والزراعة) عن طريق المقاول وتُسعّر منفصلة."
    - "الصبة والتمديدات الخارجية على العميل ما لم يُذكر غير ذلك."
price_per_m2: 1096
style: {preset: walnut_black, wood: natural_pine, railing: B04, window_grid: none, door_style: french, frame: wood_dark}
wall_height: 280
floors:
  - {name: الدور الأرضي, level: 0, height: 280}
  - {name: الدور الأول, level: 305, height: 280}
slab_height: 45
roof: {ridge_axis: y, pitch_deg: 30, overhang: 35, ext_start: 240, purlins: 1}   # السقف ممتد 2.40 م يغطي البلكونة
insulation: true
cladding_board_length: 400
pallet_length: 320

