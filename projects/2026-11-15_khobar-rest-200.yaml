# عميل الخبر: استراحة شخصية 200 م² (رسالة المصنع): صالة جلوس كبيرة + مطبخ + حمام + مغاسل + غرفة نوم بدورة مياه.
# التوزيع (20.00 × 10.00 م):
#   - الواجهة أغلبها زجاج (تعديل المصنع).
#   - غرب: الصالة الكبيرة 11.88 × 9.88 (جلسة U + طعام) — المدخل الرئيسي بالنص على التراس.
#   - شرق قدام: المغاسل مفتوحة على الصالة + الحمام بالركن (شباكه جانبي، مو على الواجهة).
#   - تعديل المصنع: إلغاء غرفة النوم، المطبخ مكانها وبابه من المغاسل، والصالة امتدت مكان المطبخ القديم
#     ومشب كامل على ضلعها الأيمن (جدار المطبخ).
# السقف (فكرة لهالتصميم): جملون طولي 22° + جملون زجاج بارز فوق المدخل يغطي مظلة الدخول على عمودين.
# الإحداثيات على محور الجدار، الجدار 12 سم (المقاس الخارجي 20.00 × 10.00)، +y = الخلف، الواجهة جنوب.
