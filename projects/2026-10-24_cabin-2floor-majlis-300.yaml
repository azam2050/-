# تعديل المصنع: إلغاء باب المجلس الخارجي — مدخل رئيسي واحد دبل كبير بالنص، والمجلس بابه من الممر عند المدخل.
# عميل جديد: كوخ دورين 300 م² (150 م² للدور — 15.00 × 10.00 م). المطلوب: أوتوكاد + صور فقط (بدون واقع افتراضي).
#  الأرضي: مجلس رجال بمدخل ضيوف مستقل (ركن الواجهة) + دورة مياهه، ممر عائلي بالنص بمدخل العائلة، مجلس نساء،
#          مطبخ يخدم المجلسين (من الممر)، صالة، ودورة مياه ثانية (آخر الممر).
#  (تعديل: شرفة للماستر تحت الجملون اليسار الممتد — الواجهة صارت متوازنة بجملونين فوق شرفتين)
#  الأول: ماستر بحمام (فوق دورة الرجال) + غرفة 2 (فوق المطبخ) + غرفة 3 بشرفة + غرفة 4 + حمام مشترك (فوق الدورة الثانية).
# السقف (فكرة جديدة — مو قالب الباحة): جملون رئيسي 30° + جملونين بارزين غير متماثلين على الواجهة:
#   يسار فوق الماستر بشباك، ويمين ممتد للأمام فوق الشرفة على أعمدة بجسر ظاهر + مظلات مداخل بجملون صغير.
# المداد ≈ 6.2 م → جسر حامل (purlin) بكل جهة. الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
