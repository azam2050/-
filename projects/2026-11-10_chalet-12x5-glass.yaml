# عميل جديد: شاليه 12.00 × 5.00 م (≈ 60 م²) — على صورة المرجع وجدول المقاسات اللي أرسلها المصنع:
#   - ارتفاع السقف الداخلي 3.00 م (الخارجي ≈ 3.70 مع الصبة والسقف)، واجهة زجاج لين السقف (≈ 3.00 م).
#   - باب المدخل 1.00 × 2.40 م، تراس أمامي بعرض الشاليه كامل وعمق 2.40 م (تعديل المصنع).
#   - سقف الحمام 2.60 – 2.70 م (سقف مستعار)، وسقف مسطح الشكل بحافة رفيعة ممتد فوق التراس، وشرائح خشب رأسية عند غرفة النوم.
# التوزيع (يسار ← يمين مثل الصورة):
#   - صالة ومطبخ مفتوح 6.82 م بواجهة زجاج كاملة على التراس.
#   - بالنص: موزع المدخل (باب 1.00 × 2.40 على التراس) + الحمام خلفه.
#   - يمين: غرفة النوم 3.22 × 4.76 بسحاب زجاج على تراسها الخاص (عمق 2.40) وشرائح خشب على طرفه.
# الإحداثيات على محور الجدار، الجدار 12 سم (المقاس الخارجي 12.00 × 5.00)، +y = الخلف، الواجهة جنوب.
