# عميل جديد: كوخ دورين على نمط الكوخ الخشبي الكلاسيكي + ملحق مجلس 5 م على طول الكوخ (ملاحظات العميل)
#  الأرضي: صالة بالشباك البارز (المدخل الرئيسي من المظلة) + غرفة طعام + غرفة نوم ضيوف + مطبخ + سيرفيس + حمامين + درج U
#          + الملحق: مجلس كبير بمدخل ضيوف من الجهة الشرقية (تحت البرندة) + باب من الموزع + مغاسل ودورة مياه
#            + باب خدمة من المطبخ للمجلس
#  الأول : 4 غرف + حمامين + غرفة ملابس، والماستر السابقة صارت غرفة نوم زيادة
#          + فوق الملحق: غرفة نوم كبيرة (ماستر) بحمام وغرفة ملابس تطل على برندة جانبية مع برجولة
#  أُلغي باب الضيوف الغربي وباب السيرفيس الشرقي (ملاحظات العميل).
# الكوخ 12.00 + الملحق 5.00 = 17.00 × 8.34 لكل دور. الحمامات على الجدار الخلفي فوق بعض (سباكة خارجية).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: villa-2floor-majlis-200
title: كوخ دورين + ملحق مجلس — 5 غرف
