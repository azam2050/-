  pitch_deg: 28             # بحر 8.34: المداد 518 سم من طبلية 520 بدون وصلات
  overhang: 40
  cross_gables:             # جملونين على الواجهة جنب بعض (مثل الفيديو): يسار فوق غرفة 3، يمين فوق البلكونة
    - {side: S, center: 200, width: 420, pitch: 42, overhang: 40, window_width: 0}
    - {side: S, center: 700, width: 420, pitch: 42, overhang: 40, window_width: 0}
    - {side: S, center: 1440, width: 420, pitch: 42, overhang: 40, window_width: 0}   # فوق الملحق
    # خلفي: نفس المثلثين موزعين على السقف بالتساوي حول النص (طلب العميل)
    - {side: N, center: 283, width: 420, pitch: 42, overhang: 40, window_width: 0}
    - {side: N, center: 844, width: 420, pitch: 42, overhang: 40, window_width: 0}
    - {side: N, center: 1405, width: 420, pitch: 42, overhang: 40, window_width: 0}
