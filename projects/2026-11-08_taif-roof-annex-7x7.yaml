# عميل جديد (الطائف): تصميم سطح 7 × 7 م — غرفة نوم + صالة + حمام + مطبخ مفتوح على الصالة (رسالة المصنع).
# التوزيع:
#   - المدخل بالنص على جهة درج السطح (جنوب) ← موزع صغير مفتوح على المطبخ والصالة.
#   - المطبخ بالركن الأمامي اليسار مفتوح على الصالة، والصالة بالخلف اليسار (جلسة L مواجهة للتلفزيون).
#   - الحمام بالركن الأمامي اليمين على جدار خارجي (شباكه جانبي مو على المدخل)، بابه من الموزع.
#   - غرفة النوم بالخلف اليمين (3.22 × 3.82)، بابها من الموزع (ما تنكشف على الجلسة)، راس السرير على جدار الحمام المصمت.
# السقف: جملون بالعرض 25° + جملون زجاج صغير بارز فوق المدخل على مظلة (فكرة سقف لهالتصميم).
# الإحداثيات على محور الجدار، الجدار 12 سم (المقاس الخارجي 7.00 × 7.00)، +y = الخلف، المدخل جنوب.
name: taif-roof-annex-7x7
