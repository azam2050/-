  overhang: 40
  ext_start: 240            # الجملون ممتد فوق التراس والبلكونة
  cross_gables:             # مثلث بارز من الجهتين (غربي فوق الحمامات، شرقي فوق الدرج)
    - {side: W, center: 625, width: 360, pitch: 45, overhang: 50, window_width: 90, window_height: 120}
    - {side: E, center: 625, width: 360, pitch: 45, overhang: 50, window_width: 110, window_height: 140}
