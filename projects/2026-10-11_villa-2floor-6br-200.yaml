# عميل جديد (ذهبان، سكن خاص، أرض 460 م²): كوخ دورين 200 م² — عرض اليوم الوطني 1,096 ر.س/م²
#  الأرضي: صالة + صالة طعام + غرفتين نوم + مطبخ + غرفة سيرفيس (بمدخل خارجي) + حمامين
#  الأول : 4 غرف نوم (ماستر على البلكونة) + صالة علوية + حمامين
# الفكرة "محترمة مو اعتيادية" (نفس الشكل المعتمد في تصميم 120): واجهة جملون بمثلث زجاج مقسّم،
#   مثلثين بارزين على الجنبين، جملون ممتد فوق تراس أرضي مسقوف + بلكونة علوية على أعمدة بارتفاع الدورين.
# المسقط 8.34 × 12.00 لكل دور = 100.08 × 2 = 200.2 م² (التراس والبلكونة مجاناً خارج المساحة).
# الحمامات الأربعة على الجدار الغربي فوق بعض (سباكة خارجية — قاعدة المصنع)، وشبابيكها مو على الواجهة.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
