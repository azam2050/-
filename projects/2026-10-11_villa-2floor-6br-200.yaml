# عميل ذهبان (سكن خاص، أرض 460 م²): كوخ دورين 200 م² — عرض اليوم الوطني 1,096 ر.س/م²
# الشكل مثل فيديو العميل (كوخ كلاسيكي):
#   جملونين بارزين على الواجهة جنب بعض + مظلة مدخل بجملون صغير على عمودين + شباك بارز مضلع بزجاج مقسّم
#   + بلكونة علوية فوق الشباك البارز بدربزين قوائم + برجولة خشب فوق باب البلكونة + شبابيك وأبواب بتقسيم خشب.
#  الأرضي: صالة (بالشباك البارز) + غرفتين نوم + مطبخ + سيرفيس (مدخل خارجي) + حمامين + درج U
#  الأول : 4 غرف نوم (الماستر على البلكونة) + حمامين + غرفة ملابس/مخزن
# المسقط 12.00 × 8.34 لكل دور = 100.08 × 2 = 200.2 م² (الشباك البارز والبلكونة والعتبة مجاناً).
# الحمامات على الجدار الخلفي فوق بعض (سباكة خارجية — قاعدة المصنع)، وشبابيكها مو على الواجهة.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
