# عميل جديد: كوخ دورين ~120 م² — 3 غرف نوم (ماستر) + صالة كبيرة + تراس، سقف جملون + تراس للدور الثاني
# (من محادثة العميل: "سقف جملون أو متداخل بتراس خارجي للدور الثاني" — "3 غرف نوم وحدة ماستر وصالة كبيرة وتراس")
#
# الفكرة: مسقط 7.80 × 7.80 لكل دور (60.8 × 2 = 121.7 م²) — 13 × 60 سم بدون هدر
#  الأرضي: صالة كبيرة مفتوحة مع مطبخ خدمة (29.5 م²) + غرفة نوم 3 + حمام + درج U
#  الأول : جناح ماستر (غرفة + حمام خاص + غرفة ملابس) يفتح على بلكونة/تراس علوي + غرفة نوم 2 + حمام
#  الحمامات الأرضي والعلوي فوق بعض (قاعدة المصنع — سباكة خارجية واحدة)
#  تراس أرضي مسقوف تحت البلكونة، والجملون ممتد فوق البلكونة على أعمدة بارتفاع الدورين
