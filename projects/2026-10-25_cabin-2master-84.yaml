# نفس العميل — الكوخ الثاني: غرفتين نوم ماستر + صالة صغيرة أول ما تدخل، والماستر يمين ويسار.
# النموذج المقترح 12.00 × 7.00 = 84 م² (متماثل):
#   - الصالة بالنص (3.64 × 6.76): جلسة بالأمام + ركن قهوة/مطبخ صغير بالخلف.
#   - كل ماستر (3.94 × 4.24): بابه من الصالة جهة الخلف (الجلسة ما تنكشف)، وفيه غرفة ملابس + حمام خاص بالخلف.
#   - السقف: جملون بالطول + جملون متقاطع فوق الصالة يمتد 1.50 م قدام على عمودين = مظلة المدخل.
# ملاحظة العميل: تراس خارجي (بعرض الواجهة) + واجهة فيها زجاج بس مو مرة زجاجية.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
