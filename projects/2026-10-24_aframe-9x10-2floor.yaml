# عميل جديد (ورقة ملاحظات): كوخ A-frame دورين 9.00 × 10.00 — ارتفاع أقل شي 8 م.
#   تحت: صالة + حمامين + مطبخ أمريكي.   فوق: غرفتين + حمام.
# الفكرة: جدار جانبي 3.00 م (الأرضي كامل بارتفاعه) + سقف حاد 48° يطلع لقمة ≈ 8.10 م = شكل A الحاد بالصورة،
#   والدور الأول داخل المثلث على منسوب +3.00: الوقفة الكاملة (≥ 2.10) بعرض ≈ 4.80 م بالنص، والأطراف تخزين/أدراج واطية.
#   - الواجهة الأمامية زجاج كامل (الأرضي + المثلث) والسقف ممتد 2.00 م قدام فوق تراس على عمودين (رفرف المثلث).
#   - الدرج مستقيم على ظهر الصالة (يطلع من الشرق للغرب) ويوصل لصالة توزيع بالنص فوق — الغرف مقفلة بجدار وباب.
#   - الحمام العلوي فوق حمام الأرضي (تصريف عمودي) وتهويته بمروحة شفط عبر السقف.
#   المداد = 4.44 / cos48 + 0.40 ≈ 7.0 م → جسر حامل (purlin) بكل جهة والمداد قطعتين ≤ طبلية 520.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
