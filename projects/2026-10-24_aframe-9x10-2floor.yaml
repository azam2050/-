# عميل جديد (ورقة ملاحظات): كوخ A-frame دورين 9.00 × 10.00 — ارتفاع أقل شي 8 م.
#   تحت: صالة + حمامين + مطبخ أمريكي.   فوق: غرفتين + حمام.
# تعديل المصنع: "مثلث حاد مثل الصورة" → A-frame حقيقي: السقف ينزل لين الأرض (قاعدة 15 سم بس على الصبة) بميل 61°،
#   القمة = 0.15 + 4.50 × tan61 ≈ 8.27 م.  (ملاحظة المصنع 2: رجل المثلث توصل الأرض — بدون جدار ظاهر تحتها)
#   - الأرضي: الوقفة الكاملة (≥ 2.10) بعرض ≈ 7.0 م، والأطراف تحت الميل للكنب والكاونتر والتخزين.
#   - الدور الأول (+3.00) داخل المثلث: الأرضية بعرض 5.90 م، الوقفة الكاملة بالنص ≈ 3.45 م (السرير والحمام والممر فيها).
#   - الواجهة الأمامية مثلث زجاج كامل والباب بالنص، والسقف ممتد 1.50 م قدام فوق تراس (رفرف المثلث).
#   - الدرج مستقيم على ظهر الصالة (يطلع من الغرب للشرق) ويوصل لممر بالنص فوق — الغرف مقفلة بجدار وباب.
#   - الحمام العلوي فوق حمام الأرضي 1 وتهويته بمروحة شفط عبر السقف؛ حمام 2 شباكه على الجملون الخلفي.
#   المداد = 4.50 / cos61 + 0.10 ≈ 9.4 م → جسرين حاملين (purlins) بكل جهة والمداد 3 قطع ≤ طبلية 520.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
