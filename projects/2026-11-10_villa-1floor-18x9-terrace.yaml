# عميل جديد: فيلا دور واحد 18.00 × 9.00 م بتراس أمامي 18.00 × 4.00 — أوتوكاد على صورة المرجع اللي أرسلها المصنع
# (نفس التقسيم ونفس المقاسات قدر الإمكان):
#   يسار: غرفة نوم 2 (4.00 × 4.00) قدام + غرفة نوم 3 (4.00 × 4.64) ورا، وجنبها حمام 3 (2.00 عرض).
#   النص: الصالة والطعام مفتوحة (عرض 8.72 × عمق 6.00) على التراس بسحابات زجاج، وبالخلف: مطبخ مفتوح + دورة مياه الضيوف
#         (1.60 × 2.00) + المدخل/الموزع (2.40 × 2.00) بباب خلفي.
#   يمين: الماستر (4.80 عرض) على التراس + حمام الماستر (3.20 × 2.40) ورا — بدون إضافات (طلب المصنع).
# ملاحظة: مقاسات الصورة (4 + 10 + 4.8) أكبر من 18 م — الصالة صارت 8.72 عشان الإجمالي يبقى 18.00 بالضبط.
# السقف مسطح الشكل (مثل الصورة): مائل خفيف 3° للخلف بصاج + عزل مائي (موافقة المصنع)، ممتد 4.00 م فوق التراس على أعمدة.
# الإحداثيات على محور الجدار، الجدار 12 سم (المقاس الخارجي 18.00 × 9.00)، +y = الخلف، الواجهة جنوب (التراس).
