# عميل جديد: كوخ A-frame 6.00 × 6.00 = 36 م² — مثل الصورة المرسلة: واجهة زجاج كاملة بقواطع خشب سوداء وتراس خشب كبير قدام.
# تعديل المصنع: غرفة وحدة مفتوحة — بدون درج وبدون حمام وبدون مطبخ وبدون ميزانين.
#   عشان ما فيه ميزانين نزّلنا الجدار الجانبي لـ 1.50 م فصار الشكل A-frame أكثر (السقف نازل قريب من الأرض)،
#   والإضاءة من الواجهة الزجاج الكاملة + شباك صغير في جملون الخلف.
# الميل 47°: المداد 515 سم (رفرف 45) من طبلية 520 بدون وصلات.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: aframe-6x6-glass
title: كوخ A-frame بواجهة زجاج كاملة — غرفة وحدة 6 × 6 = 36 م²
client: "عميل — A-frame 6×6"
meta:
  location: "—"
  usage: استراحة / جلسة
  date: 2026-10-20
  price_note: ""
  price_scope: building
  hide_pricing: true          # السعر يُحدد بعد اعتماد المخطط
style: {preset: walnut_black, wood: natural_pine, railing: B04, window_grid: none, door_style: french, frame: wood_dark}
wall_height: 150
height_exact: true
slab_height: 45
roof: {ridge_axis: y, pitch_deg: 47, overhang: 45}
insulation: false
cladding_board_length: 400
pallet_length: 320

walls:
  - name: جنوب
    title: الواجهة الأمامية (زجاج كامل)
    glass_front: true
    glass_split: true
    start: [0, 0]
    end: [588, 0]
    openings:
      - {kind: window, code: ز1, name: زجاج ثابت يسار, offset: 6, width: 235, height: 140, sill: 10, style: fixed}
      - {kind: door, code: ب1, name: ب1 باب زجاج بإطار خشب, offset: 249, width: 90, height: 210, leaves: 1}
      - {kind: window, code: ز1, name: زجاج ثابت يمين, offset: 347, width: 235, height: 140, sill: 10, style: fixed}
  - {name: شرق, title: الواجهة الشرقية, start: [588, 0], end: [588, 588]}
  - name: شمال
    title: الواجهة الخلفية
    start: [588, 588]
    end: [0, 588]
    gable_openings:   # شباك صغير في جملون الخلف (إضاءة وتهوية)
      - {code: ش1, name: ش1 شباك الجملون الخلفي, offset: 249, width: 90, height: 90, sill: 200, grid: [2, 2]}
  - {name: غرب, title: الواجهة الغربية, start: [0, 588], end: [0, 0]}

rooms:
  - {name: الغرفة (مفتوحة), rect: [6, 6, 582, 582], label: [294, 110]}

decks:
  - name: التراس الأمامي (جلسة نار + طعام خارجي)
    rect: [-6, -406, 594, -6]
    height: 45
    railing: []
    stairs: {side: S, offset: 200, width: 200}

furniture:   # فرش استرشادي (جلسة) — الغرفة مفتوحة للعميل
  - {name: كنبة 3 مقاعد, rect: [174, 400, 414, 490]}
  - {name: طاولة, rect: [234, 260, 354, 330]}
  - {name: كرسي, rect: [120, 200, 200, 280]}
  - {name: كرسي, rect: [388, 200, 468, 280]}
