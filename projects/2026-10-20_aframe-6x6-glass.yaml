    end: [0, 0]
    openings:
      - {kind: window, code: ش3, name: ش3 دورة المياه, offset: 28, width: 60, height: 45, sill: 105}
      - {kind: window, code: ش1, name: ش1 الصالة, offset: 408, width: 100, height: 85, sill: 65, grid: [2, 2]}
