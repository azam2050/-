# عميل جديد: كوخ A-frame 6.00 × 6.00 = 36 م² — مثل الصورة المرسلة: واجهة زجاج كاملة بقواطع خشب سوداء،
#   ميزانين (غرفة نوم مفتوحة) يبان من ورا الزجاج، وتراس خشب كبير قدام (جلسة نار + طعام خارجي).
#  الأرضي: صالة بارتفاع مزدوج تطل على الزجاج + مطبخ أمريكي + دورة مياه تحت الميزانين.
#  الميزانين (+2.45): غرفة نوم مفتوحة بسرير 160 على الجدار الخلفي، دربزين خشب على الحافة.
#  الدرج: حلزوني Ø1.40 قدام حافة الميزانين في الحزام الأوسط تحت القمة (ارتفاع صافي ≥ 1.90 فوق كل درجة).
# الميل 47°: المداد 515 سم (رفرف 45) من طبلية 520 بدون وصلات — عرض 6 م ما يسمح بميل أكبر من 47° بدون وصلة.
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: aframe-6x6-glass
title: كوخ A-frame بواجهة زجاج كاملة + ميزانين — 6 × 6 = 36 م²
client: "عميل — A-frame 6×6"
