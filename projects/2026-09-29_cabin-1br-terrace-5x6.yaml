# عميل: كوخ 5×6 — غرفة نوم + دورة مياه + صالة ومطبخ صغير + تراس مسقوف (نفس شكل الكوخ السابق)
# منطق التصميم:
#  - صف أمامي: صالة + مطبخ صغير على الجدار الغربي (مغسلة على جدار خارجي) — 4.76 × 2.94
#  - صف خلفي: غرفة نوم (سرير 160×200) + دورة مياه في الزاوية الخلفية تلمس جدارين خارجيين
#  - باب الغرفة وباب الحمام من الصالة مباشرة — بدون ممرات
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، التراس جنوب.
