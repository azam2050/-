# عميل جديد: دورين 120 م² (أرض 10 × 15)
# الأرضي: صالة كبيرة + مطبخ + دورة مياه ضيوف + غرفة خادمة بدورة مياه (+ مخزن/غسيل)
# الأول : 3 غرف نوم (ماستر بدورة مياه) + دورة مياه تخدم الغرفتين
# الفكرة: مسقط 7.80 × 7.70 لكل دور (60.06 × 2 = 120.1 م²)
#  - كل دورات المياه الأربع في عمود واحد على الجدار الغربي (فوق بعض) → خط صرف خارجي واحد (قاعدة المصنع)
#  - الدرج U في الركن الشمالي الشرقي، بدايته ونهايته على الممر
#  - شبابيك دورات المياه على الجدار الغربي (ممنوع الواجهة الأمامية)
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
