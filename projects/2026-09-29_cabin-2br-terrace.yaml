# عميل: كوخ غرفتين (ماستر + غرفة) + دورة مياه مشتركة + تراس خارجي مسقوف
# المرجع: صورة العميل — جملون أمامي، تراس مسقوف بامتداد السقف على أعمدة، واجهة زجاج كاملة
# مع شريط علوي، دربزين ألواح أفقية، درج عريض، خشب غامق وقرميد داكن.
#
# منطق التصميم (أقل مساحة):
#  - مستطيل 7.80 × 7.80 م = 13 × 60 سم في الاتجاهين (شبكة الأعمدة بدون هدر)
#  - صف أمامي: صالة + مطبخ خدمة مفتوح على التراس (7.56 × 3.30)
#  - صف خلفي: ماستر (يسار) | نواة مبللة + ممر 1.20 (وسط) | غرفة 2 (يمين)
#  - الحمامين متلاصقين على جدار واحد وعلى الجدار الخلفي الخارجي → صبة مفرغة واحدة ومخرج سباكة واحد
#  - لا يوجد ممر ضائع: الصالة توزع مباشرة على الماستر والممر القصير
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الشمال (الخلف)، التراس جنوب.
name: cabin-2br-terrace
title: كوخ غرفتين وتراس مسقوف 7.8×7.8
client: "عميل — تصميم حسب الصورة"
meta:
  location: "—"
  usage: استراحة / استجمام
  manager: "—"
  date: 2026-09-29
style: {preset: walnut_black, railing: B04, window_grid: none}
wall_height: 280
slab_height: 45            # 3 درجات × 15 سم (دكة مرتفعة مثل الصورة) — يحتاج موافقة المصنع
roof: {ridge_axis: y, pitch_deg: 25, overhang: 40, ext_start: 240}
insulation: false
cladding_board_length: 400
pallet_length: 320

