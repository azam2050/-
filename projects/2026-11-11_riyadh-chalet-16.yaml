# عميل الرياض: نفس تقسيم كوخ 16 بالضبط (ملف المصنع) + الواجهتين الأمامية والخلفية بالضبط على صور المصنع:
#   الأمامية: جدارين خشب رأسي على الطرفين + 3 واجهات زجاج لين السقف (غرفة الأطفال / الصالة / الماستر) بينها عمودين لياسة فاتحة،
#             رفرف ممتد 4.00 م فوق التراس بحافة خشب سميكة بدون أعمدة بالنص، تراس مرتفع ودرج عريض بالنص (3 درجات).
#   الخلفية متماثلة بالضبط: خشب متساوي على الطرفين + زجاج متساوي يمين ويسار + صامت + الباب بالنص، ودرج عريض بالنص.
#   (عشان التماثل: الخزانة وغرفة الملابس صاروا دواليب بالغرف، والحمامين بعرض الخشب 3.10 من الجهتين)
# الإحداثيات على محور الجدار، الجدار 12 سم (المقاس الخارجي 16.00 × 6.36)، +y = الخلف، التراس جنوب.
