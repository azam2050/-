# مجلس حديث 6.00 × 5.00 = 30 م² — مثل صورة العميل: صندوق خشب ألواح أفقية بلون سيدر عسلي، واجهة زجاج كاملة
# بإطارات سوداء من الأرض للسقف، وسقف يبان مسطح برفرف عميق فوق الزجاج (ظل من الشمس) — بدون تراس (طلب العميل).
# متنقل (طلب المصنع): الارتفاع الكلي 3.00 م عشان يمشي على السطحة تحت حد ارتفاع الطريق.
# السقف: مائل باتجاه واحد 5° للخلف (العالي على الواجهة الزجاج) → من قدام يبان لوح مسطح مثل الصورة،
#   والمويه تنزل للخلف برا. صاج معدني (مثل مجلس 4×5 المعتمد بميل خفيف).
# المداد: العمق 5 م + رفرف 90 أطول من طبلية 520 → جسر خشب حامل 20×30 بالنص (من الجدار الشرقي للغربي)
#   والمداد قطعتين فوقه (كل قطعة ≈ 3.70 م من طبلية 480).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
