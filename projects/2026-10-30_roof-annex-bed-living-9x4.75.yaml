# عميل جديد (صور السطح + رسالة): ملحق على السطح داخل الجدران القائمة — عرض 4.75 × طول 9.00، ارتفاع الجدار القائم 2.10.
# المطلوب: غرفة نوم 5 × 4.70 (بالآخر) + صالة 4 × 4.70 (جهة المدخل)، الفاصل بينهم بارتشن (شرائح خشب — مو جدار، تعديل المصنع).
#   - الزاوية الخلفية اليمين (جهة الشباك/الفتحة القائمة): زجاج بلو وفيه طاقة تنفتح.
#   - الصالة: طاقتها (الشباك) بالجدار جاهزة — نحافظ عليها.
#   - الركن الخلفي اليسار: باب الحمام (تعديل المصنع) — الحمام بناء بلك خلف الجدار على العميل، علينا الباب بس.
#     الدولاب انتقل للجدار الخلفي بين باب الحمام وزجاج الزاوية.
# التصميم: الجدران القائمة 2.10 ترتفع بالخشب لين 3.00 + سقف خشب جملون بالطول 20° (يصرّف على الجنبين).
# الأبعاد الداخلية: 4.75 × 9.00 = 42.75 م² — صالة 4.75 × 4.06 + نوم 4.75 × 4.94 بينهم بارتشن شرائح.
# الإحداثيات على محور الجدار (الداخل = المحور − 6)، x = العرض (يمين = شرق)، y = الطول (+y = الآخر جهة النوم)، المدخل جنوب.
