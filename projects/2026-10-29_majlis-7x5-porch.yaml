slab_height: 45
roof: {type: shed, ridge_axis: x, high_side: S, pitch_deg: 5, low_pitch_approved: true, overhang: 60, purlins: 1, soffit: true}   # مستقيم مرفوع قدام: العالي على الجلسة الخارجية وينزل بميل خفيف للجدار الخلفي (مزراب خلفي)
insulation: true
cladding_board_length: 400
pallet_length: 320

