# عميل جديد (صورة الحوش + رسالة): مجلس 7.00 × 5.00 — "نموذج 5" (جلسة أمامية تحت امتداد السقف)، سقف ممتد بس مو مسطح: ميول عالي.
# المكان: الجزء المزروع/الترابي بالحوش (بين جدران بيضاء).
# التصميم 7.00 × 5.00 = 35 م²:
#   - تعديل المصنع: سقف مائل باتجاه واحد (ميول على الجدار): العالي على جدار الحوش الخلفي وينزل بميل خفيف 5° للحوش (تعديل المصنع: السقف كله مستقيم مرفوع — صاج معدني + عزل مائي)،
#     ممتد 2.00 م قدام على عمودين (الحافة ≈ +3.10) = جلسة خارجية مسقوفة بعرض المجلس. المويه تنزل للحوش مو على الجار.
#   - الواجهة على الحوش: شباكين كبار + باب دبل على الطرف الشرقي (الجلسة تكون U متصلة ما يقطعها الباب).
#   - دورة مياه صغيرة بالركن الخلفي جنب المدخل (قريبة من الباب وبعيدة عن الجلسة).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
