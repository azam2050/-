# عميل جديد (صورة الحوش + رسالة): مجلس 7.00 × 5.00 — "نموذج 5" (جلسة أمامية تحت امتداد السقف)، سقف ممتد بس مو مسطح: ميول عالي.
# المكان: الجزء المزروع/الترابي بالحوش (بين جدران بيضاء).
# التصميم 7.00 × 5.00 = 35 م²:
#   - تعديل المصنع: سقف مستقيم بميل خفيف 5° (العالي قدام ← ينزل للخلف، مزراب خلفي) — صاج معدني + عزل مائي، بروز 60 سم يظلل الزجاج.
#   - بدون شرفة (طلب المصنع): عتبة خشب 1.00 م بعرض المجلس + درج عريض بس.
#   - الواجهة زجاج سحاب كامل بإطار أسود نحيف (مثل صورة المرجع) على عرض الواجهة كله.
#   - دورة مياه صغيرة بالركن الخلفي جنب المدخل (قريبة من الباب وبعيدة عن الجلسة).
# الإحداثيات على محور الجدار، الجدار 12 سم، +y = الخلف، الواجهة جنوب.
name: majlis-7x5-porch
title: مجلس خشب 7.00 × 5.00 م — واجهة زجاج سحاب كاملة
client: "عميل — مجلس 7×5"
